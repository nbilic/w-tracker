            <div style="font-size:18px;font-weight:500">${escapeHtml(ex.name)}</div>
          </div>
          <button class="icon-btn" onclick="closeSheet('exedit-overlay')" style="width:32px;height:32px">${svg('x', 14)}</button>
        </div>
        ${infoHtml}
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <button class="btn" style="flex:1;padding:10px;font-size:13px" onclick="openExerciseHistoryFromEdit('${escapeHtml(ex.name)}')">View history</button>
        </div>
        <div class="eyebrow" style="margin-bottom:10px">SETTINGS</div>
        <div class="v-stack" style="gap:14px">
          <div class="field">
            <span class="field-label">Notes</span>
            <textarea id="edit-note" rows="3" placeholder="Form cues...">${escapeHtml(curNote)}</textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="field">
              <span class="field-label">Step</span>
              <input id="edit-step" type="number" step="0.5" min="0.5" value="${curStep}" inputmode="decimal"/>
            </div>
            <div class="field">
              <span class="field-label">Overload</span>
              <input id="edit-po" type="number" step="0.5" min="0" value="${curPO}" inputmode="decimal"/>
            </div>
            <div class="field">
              <span class="field-label">Default sets</span>
              <input id="edit-sets" type="number" min="1" max="10" value="${curSets}" inputmode="numeric"/>
            </div>
            <div class="field">
              <span class="field-label">Default reps</span>
              <input id="edit-reps" type="text" value="${escapeHtml(String(curReps))}"/>
            </div>
          </div>
          <button class="btn btn-primary btn-block" style="padding:14px;margin-top:4px" onclick="saveExerciseOverride()">Save</button>
          ${isCustom ? `<button class="btn btn-ghost btn-block" style="color:var(--bad)" onclick="deleteCustomExercise('${exerciseId}')">Delete exercise</button>` : ''}
        </div>`;
      openSheet('exedit-overlay');
    }
    function saveExerciseOverride() {
      if (!bestiaryEditingId) return;
      const step = parseFloat(document.getElementById('edit-step').value);
      const po = parseFloat(document.getElementById('edit-po').value);
      const sets = parseInt(document.getElementById('edit-sets').value);
      const reps = (document.getElementById('edit-reps').value || '').trim();
      if (isNaN(step) || step < 0.5 || isNaN(po) || po < 0 || isNaN(sets) || sets < 1) return;
      appData.exerciseOverrides[bestiaryEditingId] = { step, po, defaultSets: sets, defaultReps: reps || '10' };
      const note = (document.getElementById('edit-note').value || '').trim();
      if (note) appData.exerciseNotes[bestiaryEditingId] = note;
      else delete appData.exerciseNotes[bestiaryEditingId];
      saveData(appData); closeSheet('exedit-overlay'); renderBestiary(); triggerHaptic('light');
    }
    function openCreateExercise() {
      bestiaryEditingId = null;
      document.getElementById('exedit-sheet').innerHTML = `
        <div class="row-between" style="margin-bottom:16px">
          <div>
            <div class="eyebrow eyebrow-accent" style="margin-bottom:4px">Create exercise</div>
            <div style="font-size:16px;font-weight:500">New entry</div>
          </div>
          <button class="icon-btn" onclick="closeSheet('exedit-overlay')" style="width:32px;height:32px">${svg('x', 14)}</button>
        </div>
        <div class="v-stack" style="gap:14px">
          <div class="field">
            <span class="field-label">Name</span>
            <input id="create-name" placeholder="Exercise name"/>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="field">
              <span class="field-label">Category</span>
              <select id="create-category" style="padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px">
                <option>Chest</option><option>Back</option><option>Shoulders</option><option>Legs</option><option>Arms</option><option>Core</option>
              </select>
            </div>
            <div class="field">
              <span class="field-label">Equipment</span>
              <select id="create-equipment" style="padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px">
                <option value="barbell">Barbell</option><option value="dumbbell">Dumbbell</option><option value="cable">Cable</option><option value="machine">Machine</option><option value="bodyweight">Bodyweight</option>
              </select>
            </div>
            <div class="field">
              <span class="field-label">Sets</span>
              <input id="create-sets" type="number" value="3" min="1" max="10" inputmode="numeric"/>
            </div>
            <div class="field">
              <span class="field-label">Reps</span>
              <input id="create-reps" type="text" value="10"/>
            </div>
            <div class="field" style="grid-column:1 / -1">
              <span class="field-label">Weight step</span>
              <input id="create-step" type="number" value="2.5" step="0.5" min="0.5" inputmode="decimal"/>
            </div>
          </div>
          <button class="btn btn-primary btn-block" style="padding:14px;margin-top:4px" onclick="saveNewExercise()">Create</button>
        </div>`;
      openSheet('exedit-overlay');
    }
    function saveNewExercise() {
      const name = (document.getElementById('create-name').value || '').trim();
      if (!name) return;
      const category = document.getElementById('create-category').value;
      const equipment = document.getElementById('create-equipment').value;
      const sets = parseInt(document.getElementById('create-sets').value) || 3;
      const reps = (document.getElementById('create-reps').value || '').trim() || '10';
      const step = parseFloat(document.getElementById('create-step').value) || 2.5;
      const id = 'custom-' + Date.now();
      const newEx = { id, name, category, equipment, defaultSets: sets, defaultReps: reps, defaultRest: 90 };
      appData.customExercises.push(newEx);
      EXERCISE_LIBRARY.push(newEx);
      LIBRARY_MAP[id] = newEx;
      appData.exerciseOverrides[id] = { step, defaultSets: sets, defaultReps: reps };
      saveData(appData); closeSheet('exedit-overlay'); renderBestiary(); triggerHaptic('success');
    }
    async function deleteCustomExercise(exerciseId) {
      if (!await customConfirm('Delete this custom exercise?')) return;
      appData.customExercises = appData.customExercises.filter(e => e.id !== exerciseId);
      delete appData.exerciseOverrides[exerciseId];
      const idx = EXERCISE_LIBRARY.findIndex(e => e.id === exerciseId);
      if (idx !== -1) EXERCISE_LIBRARY.splice(idx, 1);
      delete LIBRARY_MAP[exerciseId];
      saveData(appData); closeSheet('exedit-overlay'); renderBestiary();
    }

    // Rest timer state. Declared before boot: session recovery resumes a running rest timer,
    // and touching these before their declaration throws (which used to wipe the backup).
    let restInterval = null, isResting = false, restStartedAt = 0, restDuration = 0, restExName = 'REST', restKey = '', restSet = 0;

    /* ========== BOOT ========== */
    (function boot() {
      // Onboarding gate
      if (!localStorage.getItem('w-onboarded')) {
        showScreen('onboarding');
      } else {
        showScreen('home');
      }
      // Service worker
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      // Session recovery
      checkSessionRecovery();
    })();

    function checkSessionRecovery() {
      const raw = localStorage.getItem('workoutBackup');
      if (!raw) return;
      try {
        const backup = JSON.parse(raw);
        if (!backup || !backup.session || !backup.session.exercises || !backup.timestamp) { clearSessionBackup(); return; }
        if (Date.now() - backup.timestamp > 4 * 60 * 60 * 1000) { clearSessionBackup(); return; }
        currentSession = backup.session;
        clearInterval(elapsedInterval);
        elapsedInterval = setInterval(() => {
          const el = document.getElementById('elapsed-display');
          if (el) el.textContent = formatTime(getElapsedSeconds());
        }, 1000);
        if (activeScreen === 'home') renderHome();
        resumeRestTimer();
      } catch (e) { clearSessionBackup(); }
    }

    function resumeRestTimer() {
      if (!currentSession || !currentSession.restStartedAt || !currentSession.restDuration) return;
      restStartedAt = currentSession.restStartedAt;
      restDuration = currentSession.restDuration;
      restExName = currentSession.restExName || 'REST';
      restKey = currentSession.restKey || '';
      restSet = currentSession.restSet || 0;
      const remaining = Math.max(0, restDuration - Math.floor((Date.now() - restStartedAt) / 1000));
      if (remaining <= 0) { clearRestState(); return; }
      isResting = true;
      clearInterval(restInterval);
      restInterval = setInterval(() => {
        const rem = getRestRemaining();
        if (rem <= 0) { clearInterval(restInterval); restFinished(); }
        if (activeScreen === 'workout') updateRestRing();
      }, 1000);
    }
    function getRestRemaining() {
      if (!restStartedAt || !restDuration) return 0;
      return Math.max(0, restDuration - Math.floor((Date.now() - restStartedAt) / 1000));
    }
    function clearRestState() {
      restStartedAt = 0; restDuration = 0; isResting = false;
      if (currentSession) { delete currentSession.restStartedAt; delete currentSession.restDuration; delete currentSession.restExName; delete currentSession.restKey; delete currentSession.restSet; }
    }
    function dismissRest() {
      clearInterval(restInterval); clearRestState();
      if (activeScreen === 'workout') renderRestBar();
    }
    function restFinished() {
      dismissRest();
      triggerHaptic('restTimerDone');
      sendRestNotification();
      try {
        unlockAudio();
        const ctx = audioCtx;
        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880; gain.gain.value = 0.3;
          osc.start(ctx.currentTime + i * 0.25); osc.stop(ctx.currentTime + i * 0.25 + 0.15);
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
