    async function startWorkoutById(routineId) {
      const routine = appData.routines.find(r => r.id === routineId);
      if (!routine) return;
      if (currentSession) {
        if (!await customConfirm('Discard current workout and start ' + routine.name + '?')) return;
        clearInterval(elapsedInterval); clearSessionBackup(); releaseWakeLock(); dismissRest();
      }
      // Consume any pending next-routine override now that the user is actually starting
      if (appData.settings.pendingNextRoutineId) {
        appData.settings.pendingNextRoutineId = null;
        saveData(appData);
      }
      currentSession = {
        id: Date.now(), startedAt: Date.now(),
        routineId: routine.id, routineName: routine.name,
        type: routine.id === 'default-a' ? 'A' : routine.id === 'default-b' ? 'B' : 'C',
        date: todayISO(), notes: '',
        originalExerciseNames: routine.exercises.map(e => e.name),
        exercises: routine.exercises.map(t => {
          const lastEx = findLastSessionWithExercise(t.name);
          // Drop sets are one-off extras: they don't block the weight bump or seed next session's reps.
          const lastSets = lastEx ? lastEx.sets.filter(s => !s.drop) : [];
          let lastWeight = (lastSets.find(s => s.weight !== '' && s.weight !== null) || {}).weight || '';
          const step = getWeightStep(t.equipment, t.exerciseId);
          const po = getWeightStep(t.equipment, t.exerciseId);
          // Double progression: the weight goes up only once every set reached the TOP of the rep range
          // (a single-number target is a range of one), then reps restart at the bottom of the range.
          const range = parseRepRange(t.reps);
          let autoAdvanced = false, prevWeight = lastWeight;
          if (lastEx && lastWeight !== '' && po > 0) {
            const completedSets = lastSets.filter(s => s.completed && s.weight !== '' && s.weight !== null);
            const allCompleted = lastSets.every(s => s.completed);
            if (allCompleted && completedSets.length > 0) {
              const weights = completedSets.map(s => Number(s.weight));
              const maxW = Math.max(...weights);
              const allSameTopWeight = weights.every(w => w === maxW);
              const allMetReps = !range || completedSets.every(s => Number(s.reps) >= range.hi);
              if (allSameTopWeight && allMetReps) { lastWeight = +(maxW + po).toFixed(1); autoAdvanced = true; }
            }
          }
          const sets = [];
          for (let i = 0; i < t.sets; i++) {
            const lastReps = lastSets[i] && lastSets[i].reps !== '' && lastSets[i].reps !== null ? lastSets[i].reps : '';
            const reps = autoAdvanced && range ? range.lo : (lastReps !== '' ? lastReps : (range ? range.lo : ''));
            sets.push({ weight: lastWeight, reps, completed: false });
          }
          return { name: t.name, exerciseId: t.exerciseId, equipment: t.equipment, targetSets: t.sets,
            targetReps: t.reps, step, sets, autoAdvanced, prevWeight };
        })
      };
      expandedExerciseId = currentSession.exercises[0] ? exKey(currentSession.exercises[0], 0) : null;
      clearInterval(elapsedInterval);
      elapsedInterval = setInterval(() => {
        const el = document.getElementById('elapsed-display');
        if (el) el.textContent = formatTime(getElapsedSeconds());
      }, 1000);
      saveSessionBackup();
      showScreen('workout');
      acquireWakeLock();
      requestNotificationPermission();
    }

    function renderHistoryItem(session, unit) {
      const isOpen = historyExpandedId === String(session.id);
      const rName = session.routineName || ('Workout ' + (session.type || '?'));
      const dot = session.routineId === 'default-b' ? 'badge-dot-b' : 'badge-dot-a';
      // Same comparison as the recap: each lift against what came before this session.
      const { lifts, up, compared } = compareToLastTime(session);
      // PRs: flagged when logged, or a record this session still holds (older logs predate the flag).
      const isRecordSet = (cur, s) => cur && s.completed && !s.drop && Number(s.weight) === cur.maxWeight && (Number(s.reps) || 0) === (Number(cur.reps) || 0);
      lifts.forEach(l => {
        const cur = appData.personalRecords[l.name];
        const ex = session.exercises.find(e => e.name === l.name);
        if (cur && cur.date === session.date && ex && ex.sets.some(s => isRecordSet(cur, s))) l.pr = true; // so the row shows the star too
      });
      const prCount = lifts.filter(l => l.pr).length;
      const progress = compared ? `${up} of ${compared} up` : `${lifts.length} lift${lifts.length === 1 ? '' : 's'}`;
      const detailHtml = recapListHTML(lifts, session.offDay) + offDayControlHTML(session, lifts, compared);

      const notesHtml = session.notes ? `<div class="hist-notes">${escapeHtml(session.notes)}</div>` : '';

      return `<div class="hist-item${isOpen?' open':''}">

    // Quiet control under a session's lifts. Suggests marking when half or more of the compared lifts dipped.
    function offDayControlHTML(session, lifts, compared) {
      const id = String(session.id).replace(/'/g, '');
      if (session.offDay) return `<div class="offday"><span>Marked as off day</span><button onclick="toggleOffDay('${id}')">Undo</button></div>`;
      const dipped = lifts.filter(l => l.status === 'down').length;
      const tough = compared >= 2 && dipped * 2 >= compared;
      return `<div class="offday${tough ? ' suggest' : ''}">${tough ? '<span>Tougher day?</span>' : ''}<button onclick="toggleOffDay('${id}')">Mark as off day</button></div>`;

        </div>`;
    }

    function updateRestRing() { renderRestBar(); }

    function renderWorkoutExercises() {
      if (!currentSession) return;
      const body = document.getElementById('workout-body');
      const unit = appData.settings.unit;
      let html = '';

      currentSession.exercises.forEach((ex, ei) => {
        const key = exKey(ex, ei);
        const sets = ex.sets;
        const doneCount = sets.filter(s => s.completed).length;
        const totalCount = sets.length;
        const isDone = doneCount === totalCount;
        const isExpanded = expandedExerciseId === key;
        const activeSetIdx = sets.findIndex(s => !s.completed);

        // Subtitle only once you've started: what you did, plus how many sets are left.
        const fmt = s => {
          const w = s.weight !== '' && s.weight !== null && Number(s.weight) ? s.weight : '';
          const r = s.reps !== '' && s.reps !== null ? s.reps : '—';
          return (s.drop ? '↓' : '') + (w ? `${w}×${r}` : `${r}`);
        };
        const doneSets = sets.filter(s => s.completed);
        const left = sets.filter(s => !s.completed && !s.drop).length;
        const subtitle = !doneSets.length ? ''
          : doneSets.map(fmt).join(' · ') + (isDone || !left ? '' : ` · ${left} left`);

        html += `<div class="ex-card${isExpanded?' expanded':''}${isDone?' done':''}" id="exc-${ei}" data-ei="${ei}">
          <div class="ex-head" onclick="toggleExpanded('${key}')">
            <span class="ex-drag" data-ei="${ei}" onclick="event.stopPropagation()" aria-label="Drag to reorder">${svg('drag', 16)}</span>
            <div style="flex:1;min-width:0">
              <div class="ex-name">${escapeHtml(ex.name)}</div>
              ${subtitle ? `<div class="ex-sub">${subtitle}</div>` : ''}
            </div>
            ${progressRing(ex, doneCount, totalCount)}
          </div>`;

        if (isExpanded) {
          html += `<div class="ex-body">`;
          // What earns next session's weight bump. Mirrors the auto-advance at workout start: every regular
          // set at one weight, all ticked, all at the TOP of the rep range. After a jump that's gone badly
          // twice, the fallback advice takes its place.
          const range = parseRepRange(ex.targetReps);
          const po = getWeightStep(ex.equipment, ex.exerciseId);
          const regular = sets.filter(s => !s.drop);
          const w0 = regular.length ? Number(regular[0].weight) || 0 : 0;
          let bump = belowRangeAdvice(ex.name, w0, range, po), earned = false;
          if (!bump && range && po > 0 && w0 > 0 && regular.every(s => Number(s.weight) === w0)) {
            const next = +(w0 + po).toFixed(2);
            earned = regular.every(s => s.completed && Number(s.reps) >= range.hi);
            bump = earned ? `✓ ${next} ${unit} next time` : `Hit ${range.hi} on every set → ${next} ${unit} next time`;
          }
          if (bump) html += `<div class="ex-bump${earned ? ' earned' : ''}">${bump}</div>`;
          if (ex.equipment === 'barbell') {
            const nextSet = sets.find(s => !s.completed) || sets[0];
            const plateWeight = nextSet && nextSet.weight !== '' && nextSet.weight !== null ? Number(nextSet.weight) : 0;
            html += getPlateBreakdownHTML(plateWeight, unit);
          }
          html += `<div class="set-head-row">
            <div class="eyebrow num-col">#</div>
            <div class="eyebrow" style="text-align:center">Weight (${unit})</div>
            <div class="eyebrow reps-col">Reps</div>
            <div></div>
          </div>`;
          sets.forEach((s, si) => {
            const weightVal = s.weight !== '' && s.weight !== null ? s.weight : '';
            const repsVal = s.reps !== '' && s.reps !== null ? s.reps : '';
            const checkCls = 'set-check-btn' + (s.completed ? ' done' : '');
            const checkInner = s.completed ? svg('check', 14, 2.5) : '';
            const doneClass = s.completed ? ' done' : '';
            html += `<div class="set-row${s.drop ? ' drop' : ''}">
              <div class="set-num">${s.drop ? '↓' : si+1}</div>
              <div class="weight-cell">
                <button class="w-adj" onclick="adjSetWeight(${ei},${si},-1)">−</button>
                <input class="set-input${doneClass}" id="wi-${ei}-${si}" type="number" inputmode="decimal"
                  value="${weightVal}" placeholder="—"
                  onfocus="this.select()"
                  onchange="updateSet(${ei},${si},'weight',this.value)"/>
                <button class="w-adj" onclick="adjSetWeight(${ei},${si},1)">+</button>
              </div>
              <input class="set-input${doneClass}" id="ri-${ei}-${si}" type="number" inputmode="numeric"
                value="${repsVal}" placeholder="—"
                onfocus="this.select()"
                onchange="updateSet(${ei},${si},'reps',this.value)"/>
              <button class="${checkCls}" onclick="toggleSet(${ei},${si})">${checkInner}</button>
            </div>`;
          });
          html += `<div class="ex-actions">
            <button class="add-set-btn drop" onclick="addDropSet(${ei})">↓ Drop set</button>
            <button class="icon-btn" style="width:36px;height:36px;border-radius:10px" onclick="openSwapSheet(${ei})" title="Swap">${svg('swap', 14)}</button>
            ${ex.sets.length > 1 ? `<button class="icon-btn" style="width:36px;height:36px;border-radius:10px" onclick="removeSet(${ei})" title="Remove set">${svg('minus', 14)}</button>` : ''}
            <button class="icon-btn" style="width:36px;height:36px;border-radius:10px" onclick="openExerciseHistory('${escapeHtml(ex.name)}')" title="History" aria-label="History">${svg('history', 15)}</button>
          </div>`;
          const pr = appData.personalRecords[ex.name];
          if (pr) html += `<div class="ex-pr-strip">PR ${pr.maxWeight} ${unit.toUpperCase()} · ${pr.reps ? pr.reps + 'r' : ''}</div>`;
          html += `</div>`;
        }
        html += `</div>`;
      });

      html += `<div style="display:flex;gap:8px;margin-top:14px">
          <button class="dashed-btn" style="flex:1" onclick="openAddExerciseSheet()">${svg('plus', 16)} Add exercise</button>
          <button class="dashed-btn" style="flex:1" onclick="openNotesSheet()">${svg('note', 15)} ${currentSession.notes ? 'Edit note' : 'Add note'}</button>
        </div>
        <div style="margin-top:8px">
          <button class="btn btn-primary btn-block" style="padding:16px;font-size:15px" onclick="finishWorkout()">Finish session</button>
          <button class="btn btn-ghost btn-block" style="margin-top:6px;font-size:13px;color:var(--ink-3)" onclick="discardWorkout()">Discard session</button>
        </div>`;

      body.innerHTML = html;
      updateSessionProgress();
      animateRings(body);
      body.querySelectorAll('.ex-drag').forEach(h => {
        h.addEventListener('touchstart', onExDragStart, { passive: false });
        h.addEventListener('mousedown', onExDragStart);
      });
    }

    // Small ring per exercise: ember arc for sets ticked, solid green check when all are done.
    // It's drawn at the fill it last showed and animated to the new one (animateRings), so ticking a
    // set fills it smoothly; the last set fills it, then it pops into the check.
    const ringShown = new WeakMap(); // exercise → fraction last drawn
    const doneRingHTML = pop => `<span class="ex-ring done${pop ? ' pop' : ''}">${svg('check', 13, 3)}</span>`;
    function progressRing(ex, done, total) {
      const frac = total ? Math.min(1, done / total) : 0;
      const prev = ringShown.has(ex) ? ringShown.get(ex) : frac;
      ringShown.set(ex, frac);
      if (frac >= 1 && prev >= 1) return doneRingHTML(false);
      const r = 9, c = 2 * Math.PI * r;
      return `<span class="ex-ring"${frac >= 1 ? ' data-done="1"' : ''}><svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="2.5"/>
        <circle class="ex-ring-arc" cx="12" cy="12" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="${c}" style="stroke-dashoffset:${c * (1 - prev)}" data-to="${c * (1 - frac)}" transform="rotate(-90 12 12)"
          ${prev === 0 && frac === 0 ? 'visibility="hidden"' : ''}/>
      </svg></span>`;
    }
    function animateRings(root) {
      // Two frames so the starting offset is painted before it changes (otherwise there's no transition).
      requestAnimationFrame(() => requestAnimationFrame(() => {
        root.querySelectorAll('.ex-ring-arc').forEach(a => {
          if (a.dataset.to !== undefined) { a.removeAttribute('visibility'); a.style.strokeDashoffset = a.dataset.to; }
        });
      }));
      root.querySelectorAll('.ex-ring[data-done="1"]').forEach(el => setTimeout(() => {
        if (el.isConnected) el.outerHTML = doneRingHTML(true);
      }, 480));
    }

    // Thin bar under the header filling as sets are ticked (drop sets are extras, not counted).
    function updateSessionProgress() {
      const el = document.getElementById('session-progress');
      if (!el || !currentSession) return;
      const sets = currentSession.exercises.flatMap(e => e.sets.filter(s => !s.drop));
      const done = sets.filter(s => s.completed).length;
      const width = `${sets.length ? done / sets.length * 100 : 0}%`, label = `${done} of ${sets.length} sets`;
      const fill = el.querySelector('.sp-fill');
      if (fill) { fill.style.width = width; el.querySelector('.sp-label').textContent = label; return; } // keeps the width transition
      el.innerHTML = `<div class="sp-bar"><div class="sp-fill" style="width:${width}"></div></div><div class="sp-label">${label}</div>`;
    }

    // Drag the handle to reorder. An open card collapses first so every row is the same small height,
    // and opens again after the drop. It's collapsed in place, not re-rendered: replacing the element
    // under your finger would stop the touch events reaching us.
    let exDrag = null;
    function onExDragStart(e) {
      if (!currentSession || exDrag) return;
      const touch = e.type === 'touchstart';
      e.preventDefault(); e.stopPropagation();
      const ei = parseInt(e.currentTarget.dataset.ei);
      const exs = currentSession.exercises;
      const reopen = exs.find((x, i) => exKey(x, i) === expandedExerciseId) || null;
      const cards = [...document.querySelectorAll('#workout-body .ex-card')];
      cards.forEach(c => {
        if (!c.classList.contains('expanded')) return;
        c.classList.remove('expanded');
        const b = c.querySelector('.ex-body'); if (b) b.style.display = 'none';
      });
      const card = cards[ei]; if (!card) return;
      const rects = cards.map(c => c.getBoundingClientRect());
      const y0 = touch ? e.touches[0].clientY : e.clientY;
      // Keep the row under your finger even if collapsing the open card moved it.
      const center0 = rects[ei].top + rects[ei].height / 2;
      exDrag = { ei, target: ei, cards, rects, center0, reopen };
      card.classList.add('dragging');
      cards.forEach((c, i) => { if (i !== ei) c.classList.add('shifting'); });
      triggerHaptic('dragStart');
      moveExDrag(y0);
      const move = ev => { if (touch) ev.preventDefault(); moveExDrag(touch ? ev.touches[0].clientY : ev.clientY); };
      const end = () => {
        document.removeEventListener(touch ? 'touchmove' : 'mousemove', move);
        document.removeEventListener(touch ? 'touchend' : 'mouseup', end);
        if (touch) document.removeEventListener('touchcancel', end);
        endExDrag();
      };
      document.addEventListener(touch ? 'touchmove' : 'mousemove', move, { passive: false });
      document.addEventListener(touch ? 'touchend' : 'mouseup', end);
      if (touch) document.addEventListener('touchcancel', end);
    }
    function moveExDrag(y) {
      const { ei, cards, rects, center0 } = exDrag;
      cards[ei].style.transform = `translateY(${y - center0}px)`;
      let target = ei;
      rects.forEach((r, i) => {
        const mid = r.top + r.height / 2;
        if (i > ei && y > mid) target = i;
        if (i < ei && y < mid && i < target) target = i;
      });
      const h = rects[ei].height;
      cards.forEach((c, i) => {
        if (i === ei) return;
        c.style.transform = (i > ei && i <= target) ? `translateY(-${h}px)` : (i < ei && i >= target) ? `translateY(${h}px)` : '';
      });
      if (target !== exDrag.target) triggerHaptic('light');
      exDrag.target = target;
    }
    function endExDrag() {
      const { ei, target, reopen } = exDrag;
      exDrag = null;
      const exs = currentSession.exercises;
      if (target !== ei) {
        const [moved] = exs.splice(ei, 1);
        exs.splice(target, 0, moved);
        saveSessionBackup();
      }
      expandedExerciseId = reopen ? exKey(reopen, exs.indexOf(reopen)) : null;
      renderWorkoutExercises();
    }

    function toggleExpanded(key) {
      expandedExerciseId = expandedExerciseId === key ? null : key;
      renderWorkoutExercises();
    }

    function toggleSet(ei, si) {
      if (!currentSession) return;
      const set = currentSession.exercises[ei].sets[si];
      set.completed = !set.completed;
      if (set.completed) {
        unlockAudio();
        const exName = currentSession.exercises[ei].name;
        const isPR = !set.drop && checkForNewPR(exName, set.weight, set.reps);
        set.isPR = isPR;
        if (isPR) { triggerHaptic('pr'); launchConfetti(); }
        else triggerHaptic('setComplete');

        const allDone = currentSession.exercises.every(ex => ex.sets.every(s => s.completed));
        if (allDone) { dismissRest(); showAutoFinishToast(); }
        else {
          startRestTimer(ei, si);
          // Auto-advance expanded to next incomplete exercise
          const thisEx = currentSession.exercises[ei];
          if (thisEx.sets.every(s => s.completed)) {
            const nextIdx = currentSession.exercises.findIndex((e, i) => i !== ei && e.sets.some(s => !s.completed));
            if (nextIdx >= 0) setTimeout(() => {
              expandedExerciseId = exKey(currentSession.exercises[nextIdx], nextIdx);
              renderWorkoutExercises();
            }, 400);
          }
        }
      } else {
        set.isPR = false;
        triggerHaptic('setComplete');
      }
      saveSessionBackup();
      renderWorkoutExercises();
    }

    // One-off drop set: ~23% lighter than the last set (65 → 50), rounded to the exercise's step.
    // Flagged so it never counts toward PRs, comparisons or next session's prefill.
    function addDropSet(ei) {
      if (!currentSession) return;
      const ex = currentSession.exercises[ei];
      const last = ex.sets[ex.sets.length - 1];
      const step = ex.step !== undefined && ex.step !== null ? ex.step : getWeightStep(ex.equipment, ex.exerciseId);
      const unitStep = step > 0 ? step : 1;
      const from = Number(last.weight) || 0;
      const weight = from ? +Math.max(unitStep, Math.round(from * 0.77 / unitStep) * unitStep).toFixed(2) : '';
      ex.sets.push({ weight, reps: '', completed: false, drop: true });
      renderWorkoutExercises();
      saveSessionBackup();
    }

    // A weight change carries to later sets that still hold the old weight (or none):
    // drop from 55 to 50 on set 2 and set 3 follows. Ticked sets and drop sets are skipped;
    // a set you've deliberately set to something else stops the carry.
    function carryWeightForward(ei, si, oldWeight, newWeight) {
      const ex = currentSession.exercises[ei];
      if (ex.sets[si].drop) return;
      const blank = w => w === '' || w === null || w === undefined;
      for (let i = si + 1; i < ex.sets.length; i++) {
        const s = ex.sets[i];
        if (s.completed || s.drop) continue;
        if (!blank(s.weight) && (blank(oldWeight) || Number(s.weight) !== Number(oldWeight))) break;
        s.weight = newWeight;
        const ip = document.getElementById('wi-' + ei + '-' + i);
        if (ip) ip.value = newWeight;
      }
    }

    function adjSetWeight(ei, si, direction) {
      if (!currentSession) return;
      const ex = currentSession.exercises[ei];
      const step = ex.step !== undefined && ex.step !== null ? ex.step : getWeightStep(ex.equipment, ex.exerciseId);
      const old = ex.sets[si].weight;
      const current = (old !== '' && old !== null) ? Number(old) : 0;
      const newWeight = Math.max(0, +(current + direction * step).toFixed(2));
      ex.sets[si].weight = newWeight;
      const input = document.getElementById('wi-' + ei + '-' + si);
      if (input) input.value = newWeight;
      triggerHaptic('weightAdjust');
      carryWeightForward(ei, si, old, newWeight);
      refreshPlateBreakdown(ei);
      saveSessionBackup();
    }

    function updateSet(ei, si, field, value) {
      if (!currentSession) return;
      const numVal = value === '' ? '' : Number(value);
      const ex = currentSession.exercises[ei];
      const old = ex.sets[si][field];
      ex.sets[si][field] = numVal;
      if (field === 'weight' && numVal !== '') carryWeightForward(ei, si, old, numVal);
      if (field === 'weight') refreshPlateBreakdown(ei);
      saveSessionBackup();
    }

    /* ========== EXERCISE HISTORY VIEW ========== */
    // One concrete thing to aim for today, from last time's sets.
    function exerciseFocus(name, prevSets, curEx) {
      const unit = appData.settings.unit;
      const W = s => Number(s.weight) || 0, R = s => Number(s.reps) || 0;
      const label = s => W(s) ? `${W(s)}×${R(s)}` : `${R(s)} reps`;
      const libEx = EXERCISE_LIBRARY.find(e => e.name === name);
      const range = parseRepRange((curEx && curEx.targetReps) || (libEx && defaultRepTarget(libEx)));
      if (curEx && curEx.autoAdvanced && curEx.prevWeight !== '' && curEx.sets[0]) {
        return `Weight's up: ${curEx.prevWeight} → ${curEx.sets[0].weight} ${unit}. ${range ? `Aim for ${range.lo}+ on each set.` : "Match last time's reps."}`;
      }
      if (!prevSets.length) return '';
      const po = getWeightStep(libEx ? libEx.equipment : (curEx && curEx.equipment), libEx ? libEx.id : (curEx && curEx.exerciseId));
      const top = Math.max(...prevSets.map(W));
      const fallback = belowRangeAdvice(name, top, range, po);
      if (fallback) return fallback;
      if (range && prevSets.every(s => W(s) === top && R(s) >= range.hi)) {
        return po > 0 && top ? `You hit ${range.hi} on every set last time. Try ${+(top + po).toFixed(2)} ${unit}.` : 'Match last time, then add a rep anywhere.';
      }
      const best = Math.max(...prevSets.map(R));
      if (range && best < range.lo) return `Below range last time (${best} at ${top} ${unit}). Build toward ${range.lo}.`;
      // Double progression fills sets in order: the next rep goes on the first set short of the top of
      // the range (set 1 while you're freshest), then set 2 once set 1 is there, and so on.
      const all = prevSets.map((s, i) => ({ s, i }));
      const pool = range ? all.filter(({ s }) => R(s) < range.hi) : all;
      const pick = (pool.length ? pool : all)[0];
      return `+1 rep on set ${pick.i + 1} · ${label(pick.s)} last time`;
    }

    // Working weight over the last sessions as a step line (weight holds until it changes), with each
    // session's reps written underneath. Nothing estimated: it's the log, drawn. Tap a column for its sets.
    let exsChartData = [];
    function exerciseChartHTML(name) {
      const W = s => Number(s.weight) || 0, R = s => Number(s.reps) || 0;
      const pts = [];
      for (let i = appData.sessions.length - 1; i >= 0 && pts.length < 6; i--) {
        const e = appData.sessions[i].exercises.find(x => x.name === name);
        const sets = e ? e.sets.filter(s => s.completed && !s.drop) : [];
        if (!sets.length) continue;
        pts.unshift({ date: appData.sessions[i].date, off: !!appData.sessions[i].offDay, w: Math.max(...sets.map(W)), reps: sets.map(R).join('·'),
          sets: sets.map(s => W(s) ? `${W(s)}×${R(s)}` : `${R(s)}`).join(' · ') });
      }
      if (pts.length < 2 || pts.every(p => !p.w)) return ''; // needs history and a weight to plot
      exsChartData = pts;
      const unit = appData.settings.unit;
      const vw = 320, padL = 36, padR = 8, padT = 10, plotH = 84, labelH = 22, vh = padT + plotH + labelH;
      const colW = (vw - padL - padR) / pts.length;
      const x = i => padL + colW * (i + 0.5);
      const lo = Math.min(...pts.map(p => p.w)), hi = Math.max(...pts.map(p => p.w));
      const y = w => hi === lo ? padT + plotH / 2 : padT + (hi - w) / (hi - lo) * plotH;
      // Step-after path: flat until the next session, then a vertical jump to its weight.
      let line = pts.map((p, i) => i).filter(i => !pts[i].off);
      if (!line.length) line = pts.map((p, i) => i);
      const path = line.map((i, k) => k === 0 ? `M${x(i)},${y(pts[i].w)}` : `H${x(i)}V${y(pts[i].w)}`).join('');
      const ticks = [...new Set([hi, lo])];
      const last = pts.length - 1;
      return `<div class="exs-section">
        <div class="row-between" style="margin-bottom:6px">
          <span class="eyebrow">Progress</span>
          <span class="exs-takeaway">${progressTakeaway(pts, unit)}</span>
        </div>
        <svg class="exs-chart" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Working weight over the last ${pts.length} sessions">
          ${ticks.map(t => `<line x1="${padL}" x2="${vw - padR}" y1="${y(t)}" y2="${y(t)}" class="exs-grid"/>
            <text x="${padL - 6}" y="${y(t) + 3}" text-anchor="end" class="exs-axis">${t}</text>`).join('')}
          <path d="${path}" class="exs-line"/>
          ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="${i === last ? 5 : 4}" class="exs-dot${i === last ? ' on' : ''}${p.off ? ' off' : ''}" data-i="${i}"/>
            <text x="${x(i)}" y="${vh - 6}" text-anchor="middle" class="exs-reps">${shortDate(p.date)}</text>
            <rect x="${x(i) - colW / 2}" y="0" width="${colW}" height="${vh}" fill="transparent" style="cursor:pointer"
              onclick="selectExsChart(this.closest('.exs-section'), ${i})"/>`).join('')}
        </svg>
        <div class="exs-chart-cap exs-hint">Tap a point to see its sets</div>
      </div>`;
    }
    function shortDate(iso) { const d = new Date(iso + 'T12:00:00'); return `${d.getMonth() + 1}/${d.getDate()}`; }
    // One line on what the chart shows: weight gained over the span, or reps gained at the same weight.
    function progressTakeaway(pts, unit) {
      const real = pts.filter(p => !p.off);
      if (real.length < 2) return '';
      const a = real[0], b = real[real.length - 1];
      const days = Math.round((Date.parse(b.date) - Date.parse(a.date)) / 86400000);
      const span = days < 14 ? `${days} days` : `${Math.round(days / 7)} weeks`;
      const dw = +(b.w - a.w).toFixed(2);
      if (dw > 0) return `+${dw} ${unit} in ${span}`;
      if (dw < 0) return `${dw} ${unit} in ${span}`;
      const sum = p => p.reps.split('·').reduce((t, r) => t + (Number(r) || 0), 0);
      const dr = sum(b) - sum(a);
      return dr > 0 ? `+${dr} reps at ${b.w} ${unit}` : `Holding ${b.w} ${unit}`;
    }
    function selectExsChart(section, i) {
      const p = exsChartData[i];
      if (!p || !section) return;
      section.querySelectorAll('.exs-dot').forEach(d => { const on = +d.dataset.i === i; d.classList.toggle('on', on); d.setAttribute('r', on ? 5 : 4); });
      const cap = section.querySelector('.exs-chart-cap');
      cap.classList.remove('exs-hint');
      cap.innerHTML = `${formatDate(p.date)} · ${p.sets} <span class="exs-unit">${appData.settings.unit}</span>`;
    }

    // Exercise sheet: answers "what do I do now?" (Today, mid-workout) and "am I progressing?"
    // (chart + recent sessions), once each. PR sits by the name; the note is out of the way until used.
    let exsSheetName = '';
    function renderExerciseHistoryBody(name) {
      const unit = appData.settings.unit;
      const pr = appData.personalRecords[name];
      const libEx = EXERCISE_LIBRARY.find(e => e.name === name);
      const subtitle = libEx ? `${libEx.category.toUpperCase()} · ${libEx.equipment.toUpperCase()}` : '';
      // Same key the workout and exercise library use for notes.
      const noteKey = libEx ? libEx.id : name;
      const note = (appData.exerciseNotes || {})[noteKey] || '';

      // Mid-workout: compare against the same "last time" the recap uses, and show today's sets live.
      const curEx = currentSession && currentSession.exercises.find(e => e.name === name);
      const found = findPreviousSets(currentSession || {}, name);
      const prevSets = found ? found.sets : [];
      let lift = null;
      if (curEx && curEx.sets.some(s => s.completed && !s.drop)) {
        lift = compareToLastTime({ ...currentSession, exercises: [curEx] }).lifts[0] || null;
      }
      const label = s => Number(s.weight) ? `${s.weight}×${s.reps}` : String(s.reps);
      const gridLift = lift || { last: prevSets.map(label), tiles: [], drops: [] };
      const focus = exerciseFocus(name, prevSets, curEx);
      const fromOther = found && found.sess.routineName && found.sess.routineId !== (currentSession && currentSession.routineId)
        && currentSession;

      // Today (mid-workout): the plan in one line, what to focus on, and what earns the next jump.
      let todayHtml = '';
      if (curEx) {
        const tRange = parseRepRange(curEx.targetReps);
        const nSets = curEx.sets.filter(x => !x.drop).length;
        const w0 = Number((curEx.sets[0] || {}).weight) || 0;
        const step = getWeightStep(curEx.equipment, curEx.exerciseId);
        const rangeTxt = tRange ? (tRange.hi > tRange.lo ? `${tRange.lo}–${tRange.hi}` : `${tRange.lo}`) : '';
        const head = rangeTxt ? `${nSets} × ${rangeTxt}${w0 ? ` at ${w0} ${unit}` : ''}` : '';
        const next = tRange && step > 0 && w0
          ? `Next jump: ${w0} → <b>${+(w0 + step).toFixed(2)} ${unit}</b> after ${tRange.hi} on every set` : '';
        todayHtml = `<div class="exs-today">
          <div class="eyebrow eyebrow-accent" style="margin-bottom:6px">Today</div>
          ${head ? `<div class="exs-today-head">${head}</div>` : ''}
          ${focus ? `<div class="exs-today-focus">${focus}</div>` : (prevSets.length ? '' : '<div class="exs-today-focus">First time. Pick a weight you can do for the whole range.</div>')}
          ${next ? `<div class="exs-today-next">${next}</div>` : ''}
          ${gridLift.last.length || gridLift.tiles.length ? `<div style="margin-top:12px">
            ${fromOther ? `<div class="recap-meta">vs ${escapeHtml(found.sess.routineName)}</div>` : ''}
            ${setsGridHTML(gridLift)}
          </div>` : ''}
        </div>`;
      } else if (focus) {
        todayHtml = `<div class="exs-today">
          <div class="eyebrow eyebrow-accent" style="margin-bottom:6px">Next time</div>
          <div class="exs-today-focus">${focus}</div>
        </div>`;
      }

      // Recent sessions with this lift, each judged against its own "last time". Sets compressed:
      // "87.5 × 8,8,7,6" when the weight held, drops in purple.
      const recent = [];
      for (let i = appData.sessions.length - 1; i >= 0 && recent.length < 20; i--) {
        const sess = appData.sessions[i];
        if (!sess.exercises.some(e => e.name === name && e.sets.some(x => x.completed && !x.drop))) continue;
        const l = compareToLastTime(sess).lifts.find(x => x.name === name);
        const e = sess.exercises.find(x => x.name === name);
        if (l) recent.push({ date: sess.date, l, sets: compactSets(e.sets.filter(x => x.completed)), off: !!sess.offDay });
      }
      const recentRow = ({ date, l, sets, off }) => `<div class="exs-recent ${off ? 'off' : l.status}">
          <div class="exs-recent-head">
            <span>${formatDate(date)}</span>
            <span class="exs-res">${l.pr ? '<span class="recap-star">★</span>' : ''}${off ? 'off day' : l.summary}</span>
          </div>
          <div class="exs-recent-sets">${sets}</div>
        </div>`;

      const noteHtml = note
        ? `<div class="exs-note" data-key="${escapeHtml(noteKey)}" onclick="editExerciseNote(this)">${escapeHtml(note)}</div>`
        : '';
      const addNoteHtml = note ? ''
        : `<button class="exs-add-note" data-key="${escapeHtml(noteKey)}" onclick="editExerciseNote(this)">+ Add a note <span>seat, pins, grip, cues…</span></button>`;

      return `
        <div class="row-between" style="margin-bottom:${note ? 10 : 16}px;align-items:flex-start">
          <div style="min-width:0">
            <div style="font-size:18px;font-weight:500;margin-bottom:3px">${escapeHtml(name)}</div>
            ${subtitle ? `<div class="mono" style="font-size:10px;color:var(--ink-3);letter-spacing:0.08em">${subtitle}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            ${pr ? `<span class="exs-pr">PR ${pr.maxWeight}${pr.reps ? '×' + pr.reps : ''}</span>` : ''}
            <button class="icon-btn" onclick="closeSheet('exhistory-overlay')" style="width:32px;height:32px">${svg('x', 14)}</button>
          </div>
        </div>
        ${noteHtml}
        ${todayHtml}
        ${exerciseChartHTML(name)}
        ${recent.length ? `<div class="exs-section">
          <div class="eyebrow" style="margin-bottom:4px">Recent</div>
          ${recent.slice(0, 3).map(recentRow).join('')}
          ${recent.length > 3 ? `<div class="exs-more" hidden>${recent.slice(3).map(recentRow).join('')}</div>
            <button class="exs-show-all" onclick="this.previousElementSibling.hidden=false;this.remove()">Show all (${recent.length})</button>` : ''}
        </div>` : (curEx ? '' : '<div class="empty-state" style="padding:20px">No sessions with this exercise yet.</div>')}
        ${addNoteHtml}`;
    }
    // "87.5 × 8,8,7,6" when every regular set shares a weight, else each set; drop sets appended.
    function compactSets(sets) {
      const W = x => Number(x.weight) || 0;
      const fmt = x => W(x) ? `${W(x)}×${x.reps}` : `${x.reps}`;
      const reg = sets.filter(x => !x.drop), drops = sets.filter(x => x.drop);
      let out;
      if (reg.length && reg.every(x => W(x) === W(reg[0]))) out = W(reg[0]) ? `${W(reg[0])} × ${reg.map(x => x.reps).join(',')}` : `${reg.map(x => x.reps).join(',')} reps`;
      else out = reg.map(fmt).join(' · ');
      return out + drops.map(x => ` · <span class="exs-drop">↓${fmt(x)}</span>`).join('');
    }
    // Tap the note (or "+ Add a note") to edit it in place; it saves as you type.
    function editExerciseNote(el) {
      const key = el.dataset.key;
      const ta = document.createElement('textarea');
      ta.className = 'exhist-note';
      ta.rows = 2;
      ta.placeholder = 'Seat, pins, grip, cues…';
      ta.value = (appData.exerciseNotes || {})[key] || '';
      ta.oninput = () => saveExerciseNote(key, ta.value);
      ta.onblur = () => { document.getElementById('exhistory-sheet').innerHTML = renderExerciseHistoryBody(exsSheetName); };
      el.replaceWith(ta);
      ta.focus();
    }

    function openExerciseHistory(name) {
      exsSheetName = name;
      document.getElementById('exhistory-sheet').innerHTML = renderExerciseHistoryBody(name);
      openSheet('exhistory-overlay');
    }

    function openExerciseHistoryFromEdit(name) {
      closeSheet('exedit-overlay');
      setTimeout(() => openExerciseHistory(name), 180);
    }

    function refreshPlateBreakdown(ei) {
      if (!currentSession) return;
      const ex = currentSession.exercises[ei];
      if (ex.equipment !== 'barbell') return;
      const card = document.getElementById('exc-' + ei);
      if (!card) return;
      const unit = appData.settings.unit;
      const nextSet = ex.sets.find(s => !s.completed) || ex.sets[0];
      const plateWeight = nextSet && nextSet.weight !== '' && nextSet.weight !== null ? Number(nextSet.weight) : 0;
      const existing = card.querySelector('.plate-breakdown');
      const newHTML = getPlateBreakdownHTML(plateWeight, unit);
      if (existing) {
        if (newHTML) existing.outerHTML = newHTML;
        else existing.remove();
      } else if (newHTML) {
        const exBody = card.querySelector('.ex-body');
        if (exBody) exBody.insertAdjacentHTML('afterbegin', newHTML);
      }
    }

    async function removeSet(ei) {
      if (!currentSession) return;
      const ex = currentSession.exercises[ei];
      if (ex.sets.length <= 1) return;
      if (!await customConfirm('Remove last set?')) return;
      ex.sets.pop();
      renderWorkoutExercises();
      saveSessionBackup();
    }

    function showAutoFinishToast() {
      // Quiet: just auto-collapse and nudge user toward finish button
      triggerHaptic('workoutFinished');
    }

    async function discardWorkout() {
      if (!currentSession) return;
      if (!await customConfirm('Discard this workout? All progress will be lost.')) return;
      clearInterval(elapsedInterval); clearSessionBackup(); releaseWakeLock(); dismissRest();
      currentSession = null;
      showScreen('home');
    }

    async function finishWorkout() {
      if (!currentSession) return;
      const anyDone = currentSession.exercises.some(ex => ex.sets.some(s => s.completed));
      if (!anyDone) { discardWorkout(); return; }
      const allDone = currentSession.exercises.every(ex => ex.sets.every(s => s.completed));
      if (!allDone) {
        if (!await customConfirm('Finish workout with incomplete sets? Progress will still be saved.')) return;
      }
      clearInterval(elapsedInterval); clearSessionBackup(); releaseWakeLock();
      currentSession.totalDuration = getElapsedSeconds();
      currentSession.totalVolume = calcSessionVolume(currentSession);
      dismissRest();
      currentSession.exercises.forEach(ex => {
        ex.sets = ex.sets.filter(s => s.completed || s.weight !== '' || s.reps !== '');
      });
      appData.sessions.push(currentSession);
      rebuildAllPRs();
      saveData(appData);
      triggerHaptic('workoutFinished');
      launchConfetti();

      if (checkIfRoutineModified()) {
        setTimeout(() => openSaveRoutineSheet(), 300);
      } else {
        finishedSessionMemo = currentSession;
        currentSession = null;
        showScreen('finish');
      }
    }

    function checkIfRoutineModified() {
      if (!currentSession || !currentSession.originalExerciseNames) return false;
      const cur = currentSession.exercises.map(e => e.name);
      const orig = currentSession.originalExerciseNames;
      if (cur.length !== orig.length) return true;
      return cur.some((name, i) => name !== orig[i]);
    }

    let finishedSessionMemo = null;

    /* ========== REST TIMER ========== */
    // Learned rest is stored per exercise per set: { [exerciseKey]: { [setIndex]: seconds } }, where
    // setIndex is the set just finished. An untuned set inherits from the nearest earlier tuned set.
    function learnedRest(key, si) {
      let byset = (appData.restOverrides || {})[key];
      if (typeof byset === 'number') byset = { 0: byset }; // tolerate the earlier per-exercise format
      if (!byset) return 0;
      for (let i = si; i >= 0; i--) if (byset[i]) return byset[i];
      return 0;
    }

    function startRestTimer(ei, si = 0) {
      clearInterval(restInterval);
      // Rest length: what you've tuned for this set with ±30, else the library default, else Settings.
      let restTime = appData.settings.defaultRestTime;
      restExName = 'REST'; restKey = ''; restSet = si;
      if (ei !== undefined && currentSession && currentSession.exercises[ei]) {
        const ex = currentSession.exercises[ei];
        restExName = ex.name;
        restKey = ex.exerciseId || ex.name;
        const libEx = LIBRARY_MAP[ex.exerciseId];
        const learned = learnedRest(restKey, si);
        if (learned) restTime = learned;
        else if (libEx && libEx.defaultRest) restTime = libEx.defaultRest;
      }
      restStartedAt = Date.now();
      restDuration = restTime;
      isResting = true;
      if (currentSession) {
        currentSession.restStartedAt = restStartedAt;
        currentSession.restDuration = restDuration;
        currentSession.restExName = restExName;
        currentSession.restKey = restKey;
        currentSession.restSet = restSet;
        saveSessionBackup();
      }
      scheduleRestAlarm();
      restInterval = setInterval(() => {
        const rem = getRestRemaining();
        if (rem <= 1) cancelAlarmIfWatching();
        if (rem <= 0) { clearInterval(restInterval); restFinished(); }
        if (activeScreen === 'workout') renderRestBar();
      }, 1000);
      if (activeScreen === 'workout') renderRestBar();
    }

    // ±30 changes this rest and is remembered for this exercise's set, so next time it starts at that length.
    function adjustRest(delta) {
      if (!isResting) return;
      restDuration = Math.max(15, Math.min(600, restDuration + delta));
      if (restKey) {
        if (!appData.restOverrides) appData.restOverrides = {};
        const cur = appData.restOverrides[restKey];
        const byset = typeof cur === 'object' && cur ? cur : {};
        byset[restSet] = restDuration;
        appData.restOverrides[restKey] = byset;
        saveData(appData);
      }
      if (currentSession) { currentSession.restDuration = restDuration; saveSessionBackup(); }
      triggerHaptic('light');
      if (getRestRemaining() <= 0) { cancelRestAlarm(); dismissRest(); return; } // −30 past zero just ends the rest, quietly
      scheduleRestAlarm();
      renderRestBar();
    }


    /* ========== SHEET HELPERS ========== */
    function openSheet(id) {
      const el = document.getElementById(id);
      el.classList.add('active');
      // Close handler: click on overlay (outside sheet)
      el.onclick = (e) => { if (e.target === el) closeSheet(id); };
    }
    function closeSheet(id) {
      document.getElementById(id).classList.remove('active');
    }

    /* ========== SWAP / ADD EXERCISE SHEET ========== */
    let swapExerciseIndex = null, swapMode = 'swap', swapCat = 'All', swapEquip = 'All', swapQuery = '';

    function openSwapSheet(ei) {
      swapMode = 'swap'; swapExerciseIndex = ei;
      swapCat = 'All'; swapEquip = 'All'; swapQuery = '';
      renderSwapSheet();
      openSheet('swap-overlay');
    }
    function openAddExerciseSheet() {
      swapMode = 'add'; swapExerciseIndex = null;
      swapCat = 'All'; swapEquip = 'All'; swapQuery = '';
      renderSwapSheet();
      openSheet('swap-overlay');
    }

    function renderSwapSheet() {
      const title = swapMode === 'swap' ? 'Swap exercise' : 'Add exercise';
      const cats = ['All', ...new Set(EXERCISE_LIBRARY.map(e => e.category))];
      const equips = ['All', 'Barbell', 'Dumbbell', 'Cable', 'Machine', 'Bodyweight'];
      const currentNames = new Set((currentSession?.exercises || []).map(e => e.name));
      const filtered = EXERCISE_LIBRARY.filter(ex => {
        if (currentNames.has(ex.name)) return false;
        if (swapCat !== 'All' && ex.category !== swapCat) return false;
        if (swapEquip !== 'All' && ex.equipment !== swapEquip.toLowerCase()) return false;
        if (swapQuery && !ex.name.toLowerCase().includes(swapQuery.toLowerCase())) return false;
        return true;
      });
      const unit = appData.settings.unit;

      document.getElementById('swap-sheet').innerHTML = `
        <div class="sheet-grab"></div>
        <div class="row-between" style="margin-bottom:14px">
          <div>
            <div class="eyebrow eyebrow-accent" style="margin-bottom:3px">${title}</div>
            <div class="mono" style="font-size:11px;color:var(--ink-3)">Pick an exercise</div>
          </div>
          <button class="icon-btn" onclick="closeSheet('swap-overlay')" style="width:32px;height:32px">${svg('x', 14)}</button>
        </div>
        <div style="position:relative;margin-bottom:10px">
          <span style="position:absolute;left:12px;top:12px;color:var(--ink-4)">${svg('search', 14)}</span>
          <input id="swap-search-input" type="text" placeholder="Search exercises" value="${escapeHtml(swapQuery)}"
            oninput="swapQuery=this.value;renderSwapSheetList()"
            style="width:100%;padding:10px 12px 10px 34px;border-radius:10px" />
        </div>
        <div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none">
          ${cats.map(c => `<button class="chip${c===swapCat?' on':''}" onclick="swapCat='${escapeHtml(c)}';renderSwapSheet()">${c}</button>`).join('')}
        </div>
        <div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none">
          ${equips.map(e => `<button class="chip${e===swapEquip?' on':''}" onclick="swapEquip='${e}';renderSwapSheet()">${e}</button>`).join('')}
        </div>
        <div id="swap-list-inner" style="max-height:50vh;overflow-y:auto">
          ${filtered.length === 0 ? `<div class="empty-state">No matches</div>` :
            filtered.map(ex => {
              const lastW = getLastUsedWeight(ex.name);
              return `<div onclick="executeSwap('${ex.id}')" style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer">
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px;font-weight:500">${escapeHtml(ex.name)}</div>
                  <div class="mono" style="font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:0.06em">${ex.equipment.toUpperCase()} · ${ex.category.toUpperCase()}</div>
                </div>
                ${lastW !== null ? `<div class="mono" style="font-size:11px;color:var(--ink-3)">${lastW} ${unit}</div>` : ''}
              </div>`;
            }).join('')}
        </div>
      `;
    }
    function renderSwapSheetList() {
      // Only update the results list — never re-render the input itself,
      // because destroying a focused input on Android closes/reopens the IME.
      const inp = document.getElementById('swap-search-input');
      const q = inp ? inp.value : '';
      swapQuery = q;
      const inner = document.getElementById('swap-list-inner');
      if (!inner) return;
      const currentNames = new Set((currentSession?.exercises || []).map(e => e.name));
      const filtered = EXERCISE_LIBRARY.filter(ex => {
        if (currentNames.has(ex.name)) return false;
        if (swapCat !== 'All' && ex.category !== swapCat) return false;
        if (swapEquip !== 'All' && ex.equipment !== swapEquip.toLowerCase()) return false;
        if (swapQuery && !ex.name.toLowerCase().includes(swapQuery.toLowerCase())) return false;
        return true;
      });
      const unit = appData.settings.unit;
      inner.innerHTML = filtered.length === 0 ? `<div class="empty-state">No matches</div>` :
        filtered.map(ex => {
          const lastW = getLastUsedWeight(ex.name);
          return `<div onclick="executeSwap('${ex.id}')" style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer">
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:500">${escapeHtml(ex.name)}</div>
              <div class="mono" style="font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:0.06em">${ex.equipment.toUpperCase()} · ${ex.category.toUpperCase()}</div>
            </div>
            ${lastW !== null ? `<div class="mono" style="font-size:11px;color:var(--ink-3)">${lastW} ${unit}</div>` : ''}
          </div>`;
        }).join('');
    }

    function executeSwap(libraryId) {
      if (!currentSession) return;
      const libEx = LIBRARY_MAP[libraryId];
      if (!libEx) return;
      const step = getWeightStep(libEx.equipment, libEx.id);
      const lastEx = findLastSessionWithExercise(libEx.name);
      const lastWeight = lastEx ? (lastEx.sets.find(s => s.weight !== '' && s.weight !== null) || {}).weight || '' : '';
      const setCount = (swapMode === 'swap' && swapExerciseIndex !== null)
        ? currentSession.exercises[swapExerciseIndex].sets.length : libEx.defaultSets;
      const sets = [];
      for (let i = 0; i < setCount; i++) {
        const lastReps = lastEx && lastEx.sets[i] && lastEx.sets[i].reps !== '' && lastEx.sets[i].reps !== null ? lastEx.sets[i].reps : '';
        sets.push({ weight: lastWeight, reps: lastReps, completed: false });
      }
      const newEx = { name: libEx.name, exerciseId: libEx.id, equipment: libEx.equipment,
        targetSets: libEx.defaultSets, targetReps: defaultRepTarget(libEx), step, sets };
      if (swapMode === 'add') { currentSession.exercises.push(newEx); }
      else { currentSession.exercises[swapExerciseIndex] = newEx; }
      expandedExerciseId = exKey(newEx, swapMode === 'add' ? currentSession.exercises.length - 1 : swapExerciseIndex);
      closeSheet('swap-overlay');
      triggerHaptic('setComplete');
      saveSessionBackup();
      renderWorkoutExercises();
    }

    /* ========== NOTES SHEET ========== */
    // Exercise note (the same one the exercise library edits), saved as you type in the exercise sheet.
    function saveExerciseNote(key, value) {
      const note = value.trim();
      if (!appData.exerciseNotes) appData.exerciseNotes = {};
      if (note) appData.exerciseNotes[key] = note;
      else delete appData.exerciseNotes[key];
      saveData(appData);
    }

    /* ========== SAVE ROUTINE SHEET ========== */
    function openSaveRoutineSheet() {
      const rName = (currentSession && currentSession.routineName) || 'My Routine';
      document.getElementById('saveroutine-sheet').innerHTML = `
        <div class="sheet-grab"></div>
        <div style="margin-bottom:14px">
          <div class="eyebrow eyebrow-accent" style="margin-bottom:3px">Routine modified</div>
          <div class="mono" style="font-size:11px;color:var(--ink-3)">You swapped exercises during this workout</div>
        </div>
        <input id="new-routine-name-input" type="text" placeholder="New routine name..." style="width:100%;padding:12px 14px;margin-bottom:12px" />
        <div class="v-stack" style="gap:8px">
          <button class="btn btn-primary btn-block" style="padding:14px" onclick="saveAsNewRoutine()">Save as new routine</button>
          <button class="btn btn-block" style="padding:14px" onclick="updateExistingRoutine()">Update "${escapeHtml(rName)}"</button>
          <button class="btn btn-ghost btn-block" style="font-size:13px;color:var(--ink-3)" onclick="skipSaveRoutine()">Skip</button>
        </div>`;

    }
    function saveAsNewRoutine() {
      const name = (document.getElementById('new-routine-name-input')?.value || '').trim() || ('Custom ' + (appData.routines.length + 1));
      appData.routines.push({
        id: 'custom-' + Date.now(), name, colorIndex: appData.routines.length % 4,
        isDefault: false,
        exercises: currentSession.exercises.map(ex => ({
          exerciseId: ex.exerciseId || '', name: ex.name, sets: ex.targetSets,
          reps: ex.targetReps, equipment: ex.equipment
        }))
      });
      saveData(appData);
      closeSheet('saveroutine-overlay');
      finishedSessionMemo = currentSession; currentSession = null;
      showScreen('finish');
    }
    function updateExistingRoutine() {
      if (currentSession) {
        const r = appData.routines.find(x => x.id === currentSession.routineId);
        if (r) {
          r.exercises = currentSession.exercises.map(ex => ({
            exerciseId: ex.exerciseId || '', name: ex.name, sets: ex.targetSets,
            reps: ex.targetReps, equipment: ex.equipment
          }));
          saveData(appData);
        }
      }
      closeSheet('saveroutine-overlay');
      finishedSessionMemo = currentSession; currentSession = null;
      showScreen('finish');
    }
    function skipSaveRoutine() {
      closeSheet('saveroutine-overlay');
      finishedSessionMemo = currentSession; currentSession = null;
      showScreen('finish');
    }

    /* ========== FINISH SCREEN ========== */
    // Completed sets from the last time this exercise was done before sessions[before], in any
    // routine. Returns { sets, sess } or null.
    // Off days are skipped as a baseline, so a weak day doesn't make the next one look like a big gain.
    function findPreviousSets(session, name, before = appData.sessions.length) {
      const lastWith = (skipOff = true) => {
        for (let i = before - 1; i >= 0; i--) {
          const sess = appData.sessions[i];
          if (skipOff && sess.offDay) continue;
          const e = sess.exercises.find(e => e.name === name);
          // Drop sets are extras, never part of the comparison.
          const done = e ? e.sets.filter(s => s.completed && !s.drop) : [];
          if (done.length) return { sets: done, sess };
        }
        return null;
      };
      return lastWith() || lastWith(false);
    }

    // Compare each exercise against the last time it was done, in any routine. When that was
    // a different routine, the lift's meta says which, since position changes how fresh you are.
    // Returns { lifts, up, compared }. Each lift:
    //   { name, meta, status: 'up'|'steady'|'down'|'first', summary, pr, tiles: [{ val, delta, kind }] }
    // Tile kinds: up, same, down, new (extra set today), missed (done last time, not today), pr.
    function compareToLastTime(session) {
      const idx = appData.sessions.indexOf(session);
      const before = idx === -1 ? appData.sessions.length : idx;
      const W = s => Number(s.weight) || 0, R = s => Number(s.reps) || 0;
      const unit = appData.settings.unit;
      const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
      const signed = (d, suffix = '') => `${d > 0 ? '+' : '−'}${+Math.abs(d).toFixed(2)}${suffix}`;
      const lifts = [];
      session.exercises.forEach(ex => {
        const cur = ex.sets.filter(s => s.completed && !s.drop);
        if (!cur.length) return;
        const pr = cur.some(s => s.isPR);
        const found = findPreviousSets(session, ex.name, before);
        const prev = found ? found.sets : [];
        // Always weight×reps; bodyweight sets show reps only.
        const label = s => W(s) ? `${W(s)}×${R(s)}` : String(R(s));
        // Shown alongside today's sets, but never compared.
        const drops = ex.sets.filter(s => s.completed && s.drop).map(label);
        const from = found && !(found.sess.routineId && found.sess.routineId === session.routineId)
          ? `vs ${found.sess.routineName || 'other workout'}` : '';
        const meta = from;

        if (!found) {
          lifts.push({ name: ex.name, meta, status: 'first', summary: 'new', pr, last: [], drops,
            tiles: cur.map(s => ({ val: label(s), delta: '', kind: s.isPR ? 'pr' : 'same' })) });
          return;
        }

        const tiles = [];
        for (let i = 0; i < Math.max(cur.length, prev.length); i++) {
          const c = cur[i], p = prev[i];
          if (!c) { tiles.push({ val: label(p), delta: '—', kind: 'missed' }); continue; }
          let kind = 'new', delta = 'new';
          if (p && W(c) === W(p)) {
            const d = R(c) - R(p);
            kind = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
            delta = d ? signed(d) : '';
          } else if (p) {
            const d = W(c) - W(p);
            kind = d > 0 ? 'up' : 'down';
            delta = signed(d, unit);
          }
          tiles.push({ val: label(c), delta, kind: c.isPR ? 'pr' : kind });
        }

        const n = Math.min(cur.length, prev.length);
        const extra = cur.length - prev.length;
        let status, summary, note = '';
        if (cur.slice(0, n).every((s, i) => W(s) === W(prev[i]))) {
          // Same weights set-for-set: reps decide. Any slipped or skipped set means it didn't move forward.
          let down = extra < 0, up = false, net = 0;
          for (let i = 0; i < n; i++) {
            const d = R(cur[i]) - R(prev[i]);
            if (d > 0) up = true; if (d < 0) down = true; net += d;
          }
          if (!down && up) { status = 'up'; summary = `+${plural(net, 'rep')}`; }
          else if (!down && extra > 0) { status = 'up'; summary = `+${plural(extra, 'set')}`; }
          else if (!down && extra === 0) { status = 'steady'; summary = 'held'; }
          else {
            status = 'down';
            summary = net < 0 ? `−${plural(-net, 'rep')}` : extra < 0 ? `−${plural(-extra, 'set')}` : 'mixed';
          }
        } else {
          // Weights changed: heavier top set wins, otherwise total work at the same top weight.
          const topW = sets => Math.max(...sets.map(W));
          const vol = sets => sets.reduce((a, s) => a + W(s) * R(s), 0);
          // Show the top weight as from → to (unambiguous vs a bare "+2.5 kg"), volume as a percentage.
          const tc = topW(cur), tp = topW(prev), vp = vol(prev), dv = vol(cur) - vp;
          const pct = vp ? Math.max(1, Math.round(Math.abs(dv) / vp * 100)) : 0;
          const topChange = `${tp} → ${tc} ${unit}`;
          if (tc > tp) { status = 'up'; summary = topChange; }
          else if (tc === tp && dv > 0) { status = 'up'; summary = `+${pct}% volume`; }
          else if (tc < tp) { status = 'down'; summary = topChange; }
          else { status = 'down'; summary = dv < 0 ? `−${pct}% volume` : 'mixed'; }
          // Top weight and total work moved in opposite directions: state the trade-off, don't judge it.
          if (pct >= 10 && tc !== tp && (tc > tp) !== (dv > 0)) {
            note = `Top set ${tc > tp ? 'up' : 'down'} · total volume ${dv > 0 ? '+' : '−'}${pct}%`;
          }
        }
        lifts.push({ name: ex.name, meta, status, summary, note, pr, tiles, drops, last: prev.map(label) });
      });
      // Forward (and PRs) first, then held, then dipped, then new lifts.
      const rank = l => l.status === 'up' || l.pr ? 0 : { steady: 1, down: 2, first: 3 }[l.status];
      lifts.sort((a, b) => rank(a) - rank(b));
      return {
        lifts,
        up: lifts.filter(l => l.status === 'up').length,
        compared: lifts.filter(l => l.status !== 'first').length,
      };
    }

    // Recap rows expand one at a time. Toggled in the DOM (no re-render) so the sample preview keeps its data.
    function toggleRecapRow(row) {
      const open = row.classList.contains('open');
      row.parentElement.querySelectorAll('.recap-row.open').forEach(r => r.classList.remove('open'));
      if (!open) row.classList.add('open');
    }

    // Last/today sets as a grid so set N lines up under set N. Drop sets trail today's row, past both
    // rows' regular sets, so they never sit under a "last" value. Used by the recap and the exercise sheet.
    function setsGridHTML(l) {
      const today = l.tiles.filter(t => t.kind !== 'missed');
      const regular = Math.max(l.last.length, today.length);
      const todayCells = today.length || l.drops.length
        ? [...today, ...Array(regular - today.length).fill(null), ...l.drops.map(val => ({ val, kind: 'drop' }))] : [];
      const n = Math.max(todayCells.length, l.last.length);
      const row = (tag, cells) => `<span class="recap-tag">${tag}</span>` +
        Array.from({ length: n }, (_, i) => cells[i] ? `<span class="v ${cells[i].kind}">${cells[i].val}</span>` : '<span></span>').join('');
      return `<div class="recap-grid" style="--n:${n}">
        ${l.last.length ? row('Last', l.last.map(val => ({ val, kind: 'last' }))) : ''}
        ${todayCells.length ? row('Today', todayCells) : ''}
      </div>`;
    }

    // One row per lift: result on the right, tap to open last vs today. Used by the recap and History.
    function recapListHTML(lifts, offDay = false) {
      if (!lifts.length) return '';
      return `<div class="recap-list${offDay ? ' off' : ''}">
        ${lifts.map(l => `<div class="recap-row ${l.status}" onclick="toggleRecapRow(this)">
          <div class="recap-head">
            <div class="recap-name">${escapeHtml(l.name)}</div>
            <div class="recap-res">${l.pr ? '<span class="recap-star">★</span>' : ''}${l.summary}<span class="recap-chev">${svg('chevRight', 12, 2)}</span></div>
          </div>
          <div class="recap-detail">
            ${l.meta ? `<div class="recap-meta">${escapeHtml(l.meta)}</div>` : ''}
            ${setsGridHTML(l)}
            ${l.note ? `<div class="recap-note">${l.note}</div>` : ''}
          </div>
        </div>`).join('')}
      </div>`;
    }

    function renderFinish() {
      const s = finishedSessionMemo;
      const el = document.getElementById('finish-screen');
      if (!s) {
        el.innerHTML = `<div class="empty-state">No recent session.</div>
          <button class="btn btn-primary btn-block" onclick="showScreen('home')">Go home</button>`;
        return;
      }
      const { lifts, up, compared } = compareToLastTime(s);
      const stronger = up > 0 || lifts.some(l => l.pr);
      const title = s.offDay ? 'Showed <em>up.</em>' : stronger ? 'Stronger than <em>last time.</em>' : 'Clean work.';
      el.innerHTML = `
        <div class="finish-head">
          <div class="eyebrow eyebrow-accent" style="margin-bottom:6px">Session complete</div>
          <div class="finish-title">${title}</div>
          <div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.1em">
            ${escapeHtml(s.routineName || 'WORKOUT').toUpperCase()} · ${formatTime(s.totalDuration || 0)}
          </div>
        </div>
        ${recapListHTML(lifts, s.offDay)}
        ${s.id !== undefined ? offDayControlHTML(s, lifts, compared) : ''}
        ${availableUpdate ? `<div class="offday update-nudge"><span>Update available · v${escapeHtml(availableUpdate.version)}</span><button onclick="openUpdateSheet()">See what's new</button></div>` : ''}
        ${backupDue() ? `<div class="offday backup-nudge"><span>Last backup: ${backupAgeText()}</span><button onclick="backupData()">Back up now</button></div>` : ''}
        <button class="btn btn-primary btn-block" style="padding:16px;font-size:15px" onclick="finishedSessionMemo=null;showScreen('home')">${svg('check', 16, 2.5)} Save & go home</button>`;
    }

    /* ========== PROGRESS ========== */
    let progressSelectedIdx = 0;
    let progressView = 'weight'; // weight | volume | 1rm
    // Time range for the Progress screen. The chart, headline and list rows all follow it.
    let progressRange = '3m';
    const PROGRESS_RANGES = {
      '4w': { days: 28, label: '4W', span: 'in 4 weeks' },
      '3m': { days: 91, label: '3M', span: 'in 3 months' },
      '6m': { days: 182, label: '6M', span: 'in 6 months' },
      'all': { days: Infinity, label: 'All', span: 'all time' },
    };
    function inProgressRange(data) {
      const { days } = PROGRESS_RANGES[progressRange];
      if (!isFinite(days)) return data;
      const cut = new Date(); cut.setDate(cut.getDate() - days);
      const c = cut.toISOString().slice(0, 10);
      return data.filter(d => d.date >= c);
    }

    function getExerciseProgressData(exerciseName) {
      const data = [];
      appData.sessions.forEach(s => {
        const ex = s.exercises.find(e => e.name === exerciseName);
        if (!ex) return;
        let maxW = 0, totalVolume = 0, best1RM = 0, completed = 0;
        ex.sets.forEach(set => {
          if (set.completed && set.weight !== '' && set.weight !== null) {
            const w = Number(set.weight), r = Number(set.reps) || 0;
            maxW = Math.max(maxW, w); totalVolume += w * r; completed++;
            if (w > 0 && r > 0) { const e = w * (1 + r / 30); if (e > best1RM) best1RM = e; }
          }
        });
        if (maxW > 0) data.push({ date: s.date, weight: maxW, volume: totalVolume, est1rm: Math.round(best1RM), sets: completed, offDay: !!s.offDay });
      });
      return data;
    }

    function fmtChartVal(v, field) {
      if (field === 'volume') {
        if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
        return String(Math.round(v));
      }
      const n = +Number(v).toFixed(1);
      return n % 1 === 0 ? String(n) : n.toFixed(1);
    }

    let chartState = null;
    function svgChart(points, field) {
      const filtered = points.filter(p => p[field] > 0);
      if (filtered.length === 0) { chartState = null; return `<div class="empty-state" style="padding:20px">No data for this view.</div>`; }
      const vals = filtered.map(p => p[field]);
      const w = 360, h = 180;
      const padL = 42, padR = 14, padT = 16, padB = 26;
      const minV = Math.min(...vals), maxV = Math.max(...vals);
      // Snap the y-range to round ticks: try steps of 1/2/2.5/5 × 10ⁿ (coarse enough to read as round,
      // at least a sixth of the range) and keep the tightest fit. An even step count keeps the middle tick round.
      const range = Math.max(maxV - minV, maxV * 0.1, 2);
      let fit = null;
      for (let e = -1; e <= 5; e++) for (const m of [1, 2, 2.5, 5]) {
        const st = m * 10 ** e;
        if (st < range / 6) continue;
        let lo = Math.floor(minV / st) * st, hi = Math.ceil(maxV / st) * st;
        if (hi === lo) hi += st;
        if (Math.round((hi - lo) / st) % 2) hi += st;
        if (!fit || hi - lo < fit.hi - fit.lo) fit = { lo, hi };
      }
      const yMin = fit.lo, yMax = fit.hi;
      const span = yMax - yMin;
      // X is by date, so breaks and deloads show as real gaps rather than evenly spaced sessions.
      const ts = filtered.map(p => Date.parse(p.date + 'T12:00:00'));
      const t0 = ts[0], t1 = ts[ts.length - 1];
      const xfn = i => padL + (t1 > t0 ? (ts[i] - t0) / (t1 - t0) : 0.5) * (w - padL - padR);
      const yfn = v => padT + (h - padT - padB) * (1 - (v - yMin) / span);
      // The line runs through normal sessions only; off days sit on it as hollow dots.
      let onLine = vals.map((v, i) => i).filter(i => !filtered[i].offDay);
      if (!onLine.length) onLine = vals.map((v, i) => i);
      const path = onLine.map((i, k) => `${k === 0 ? 'M' : 'L'} ${xfn(i).toFixed(1)} ${yfn(vals[i]).toFixed(1)}`).join(' ');
      const area = path + ` L ${xfn(onLine[onLine.length - 1]).toFixed(1)} ${(h - padB).toFixed(1)} L ${xfn(onLine[0]).toFixed(1)} ${(h - padB).toFixed(1)} Z`;

      // Y-axis ticks (3 rows: top, middle, bottom)
      const yTicks = [1, 0.5, 0].map(t => {
        const val = yMin + span * t;
        const y = padT + (h - padT - padB) * (1 - t);
        return `<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="0.5"/>
          <text x="${padL - 6}" y="${y + 3.5}" text-anchor="end" fill="var(--ink-4)" font-family="Geist Mono, monospace" font-size="9">${fmtChartVal(val, field)}</text>`;
      }).join('');

      // X-axis ticks — first, middle, last (MM-DD)
      // Date ticks at the start, the time midpoint and the end of the range.
      const md = t => { const d = new Date(t); return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`; };
      const tickTimes = t1 > t0 ? [t0, (t0 + t1) / 2, t1] : [t0];
      const xTicks = tickTimes.map(t => {
        const x = padL + (t1 > t0 ? (t - t0) / (t1 - t0) : 0.5) * (w - padL - padR);
        return `<text x="${x.toFixed(1)}" y="${h - 8}" text-anchor="middle" fill="var(--ink-4)" font-family="Geist Mono, monospace" font-size="9">${md(t)}</text>`;
      }).join('');

      // Dots on every point
      const dots = vals.map((v, i) => {
        if (i === vals.length - 1) return '';
        if (filtered[i].offDay) return `<circle cx="${xfn(i).toFixed(1)}" cy="${yfn(v).toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.25"/>`;
        return `<circle cx="${xfn(i).toFixed(1)}" cy="${yfn(v).toFixed(1)}" r="2.5" fill="var(--accent)" opacity="0.7"/>`;
      }).join('');

      // Last point + floating label
      const last = vals[vals.length - 1];
      const lastX = xfn(vals.length - 1), lastY = yfn(last);
      const lastTxt = fmtChartVal(last, field);
      const lblY = lastY > padT + 18 ? lastY - 12 : lastY + 20;
      const lblAnchor = lastX > w - padR - 28 ? 'end' : 'middle';
      const lblX = lastX > w - padR - 28 ? lastX - 4 : lastX;

      // Save state for scrubber interactions
      chartState = { filtered, field, w, h, padL, padR, padT, padB, yMin, span, ts, t0, t1 };

      return `<svg id="prog-chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;margin-top:10px;overflow:visible;touch-action:none">
        <defs>
          <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${yTicks}
        <g id="chart-base">
          <path d="${area}" fill="url(#chart-grad)"/>
          <path d="${path}" stroke="var(--accent)" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="6" fill="var(--accent)" opacity="0.2"/>
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--accent)"/>
          <text id="chart-last-label" x="${lblX.toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="${lblAnchor}" fill="var(--accent)" font-family="Geist Mono, monospace" font-size="11" font-weight="600">${lastTxt}</text>
          ${xTicks}
        </g>
        <g id="chart-scrubber"></g>
      </svg>`;
    }

    function chartXfn(i) {
      const { padL, padR, w, ts, t0, t1 } = chartState;
      return padL + (t1 > t0 ? (ts[i] - t0) / (t1 - t0) : 0.5) * (w - padL - padR);
    }
    function chartYfn(v) {
      const { padT, padB, h, yMin, span } = chartState;
      return padT + (h - padT - padB) * (1 - (v - yMin) / span);
    }

    function chartScrub(clientX) {
      if (!chartState) return;
      const svg = document.getElementById('prog-chart');
      const scrub = document.getElementById('chart-scrubber');
      const lastLabel = document.getElementById('chart-last-label');
      if (!svg || !scrub) return;
      const rect = svg.getBoundingClientRect();
      const { filtered, field, w, h, padL, padR, padT, padB } = chartState;
      const vbX = ((clientX - rect.left) / rect.width) * w;
      let nearest = 0, bestD = Infinity;
      filtered.forEach((p, i) => {
        const d = Math.abs(chartXfn(i) - vbX);
        if (d < bestD) { bestD = d; nearest = i; }
      });
      const p = filtered[nearest];
      const cx = chartXfn(nearest), cy = chartYfn(p[field]);
      const dateStr = p.date.slice(5).replace('-', '/');
      const valStr = fmtChartVal(p[field], field);
      const tipText = `${valStr} · ${dateStr}`;
      const tipW = Math.max(78, tipText.length * 6.2 + 14);
      const tipX = Math.max(padL - 4, Math.min(w - padR - tipW, cx - tipW / 2));
      const tipY = Math.max(2, cy - 28);
      if (lastLabel) lastLabel.setAttribute('opacity', '0');
      scrub.innerHTML = `
        <line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${padT}" y2="${h - padB}" stroke="var(--accent)" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.6"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="var(--accent)" opacity="0.25"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.5" fill="var(--accent)"/>
        <rect x="${tipX.toFixed(1)}" y="${tipY.toFixed(1)}" width="${tipW}" height="20" rx="5" fill="var(--surface)" stroke="var(--accent-line)" stroke-width="0.75"/>
        <text x="${(tipX + tipW / 2).toFixed(1)}" y="${(tipY + 13).toFixed(1)}" text-anchor="middle" fill="var(--accent)" font-family="Geist Mono, monospace" font-size="11" font-weight="600">${tipText}</text>
      `;
    }
    function chartScrubClear() {
      const scrub = document.getElementById('chart-scrubber');
      const lastLabel = document.getElementById('chart-last-label');
      if (scrub) scrub.innerHTML = '';
      if (lastLabel) lastLabel.setAttribute('opacity', '1');
    }

    function wireChart() {
      const svg = document.getElementById('prog-chart');
      if (!svg || !chartState) return;
      let scrubbing = false;
      svg.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        scrubbing = true;
        chartScrub(e.touches[0].clientX);
      }, { passive: true });
      svg.addEventListener('touchmove', (e) => {
        if (!e.touches[0]) return;
        e.preventDefault();
        chartScrub(e.touches[0].clientX);
      }, { passive: false });
      svg.addEventListener('touchend', () => { scrubbing = false; chartScrubClear(); });
      svg.addEventListener('mousedown', (e) => { scrubbing = true; chartScrub(e.clientX); });
      svg.addEventListener('mousemove', (e) => { if (scrubbing) chartScrub(e.clientX); });
      const endDrag = () => { scrubbing = false; chartScrubClear(); };
      svg.addEventListener('mouseup', endDrag);
      svg.addEventListener('mouseleave', endDrag);
    }

    function miniChart(points, field) {
      const vals = points.map(p => p[field]).filter(v => v > 0);
      if (vals.length < 2) return `<svg width="60" height="24"></svg>`;
      const w = 60, h = 24;
      const min = Math.min(...vals), max = Math.max(...vals);
      const xfn = i => (i / Math.max(1, vals.length - 1)) * w;
      const yfn = v => h - 2 - ((v - min) / (max - min || 1)) * (h - 4);
      const path = vals.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xfn(i)} ${yfn(v)}`).join(' ');
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <path d="${path}" stroke="var(--ink-2)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    function renderProgress() {
      const el = document.getElementById('progress-screen');
      const allNames = new Set();
      appData.sessions.forEach(s => s.exercises.forEach(ex => allNames.add(ex.name)));
      if (allNames.size === 0) {
        el.innerHTML = `
          <div style="padding-top:4px">
            <div class="eyebrow" style="margin-bottom:10px">Progress</div>
            <h1 class="screen-title">Progress.</h1>
          </div>
          <div class="empty-state">Complete some workouts to see charts.</div>`;
        return;
      }
      // Respect saved chart order, append any new exercises at the end
      const savedOrder = appData.settings.chartOrder || [];
      const names = [];
