    let progressDragState = null;
    function initProgressDragHandles(names) {
      document.querySelectorAll('.ex-list-drag').forEach(h => {
        h.addEventListener('touchstart', (e) => onProgressDragStart(e, names, 'touch'), { passive: false });
        h.addEventListener('mousedown', (e) => onProgressDragStart(e, names, 'mouse'));
      });
    }
    function onProgressDragStart(e, names, kind) {
      e.preventDefault();
      const pi = parseInt(e.currentTarget.getAttribute('data-pi'));
      const clientY = kind === 'touch' ? e.touches[0].clientY : e.clientY;
      startProgressDrag(pi, clientY, names);
      if (kind === 'touch') {
        const mv = (ev) => { ev.preventDefault(); moveProgressDrag(ev.touches[0].clientY); };
        const en = () => { endProgressDrag(); document.removeEventListener('touchmove', mv); document.removeEventListener('touchend', en); };
        document.addEventListener('touchmove', mv, { passive: false });
        document.addEventListener('touchend', en);
      } else {
        const mv = (ev) => moveProgressDrag(ev.clientY);
        const en = () => { endProgressDrag(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', en); };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', en);
      }
    }
    function startProgressDrag(pi, startY, names) {
      const rows = document.querySelectorAll('#progress-ex-list .ex-list-row');
      const card = rows[pi]; if (!card) return;
      triggerHaptic('dragStart');
      const rects = Array.from(rows).map(c => c.getBoundingClientRect());
      progressDragState = { pi, startY, card, rects, names: [...names] };
      card.classList.add('dragging');
    }
    function moveProgressDrag(clientY) {
      if (!progressDragState) return;
      const { pi, startY, card, rects } = progressDragState;
      const delta = clientY - startY;
      card.style.transform = `translateY(${delta}px)`;
      const dragCenter = rects[pi].top + rects[pi].height / 2 + delta;
      let newIndex = pi;
      for (let i = 0; i < rects.length; i++) {
        if (i === pi) continue;
        const center = rects[i].top + rects[i].height / 2;
        if (pi < i && dragCenter > center) newIndex = i;
        if (pi > i && dragCenter < center && i < newIndex) newIndex = i;
      }
      const rows = document.querySelectorAll('#progress-ex-list .ex-list-row');
      rows.forEach((c, i) => {
        if (i === pi) return;
        if (pi < newIndex && i > pi && i <= newIndex) c.style.transform = `translateY(-${rects[pi].height}px)`;
        else if (pi > newIndex && i < pi && i >= newIndex) c.style.transform = `translateY(${rects[pi].height}px)`;
        else c.style.transform = '';
      });
      progressDragState.targetIndex = newIndex;
    }
    function endProgressDrag() {
      if (!progressDragState) return;
      const { pi, targetIndex, names } = progressDragState;
      document.querySelectorAll('#progress-ex-list .ex-list-row').forEach(c => { c.style.transform = ''; c.classList.remove('dragging'); });
      if (targetIndex !== undefined && targetIndex !== pi) {
        const [moved] = names.splice(pi, 1);
        names.splice(targetIndex, 0, moved);
        appData.settings.chartOrder = names;
        saveData(appData);
        // Keep selected exercise pinned to its new index
        if (progressSelectedIdx === pi) progressSelectedIdx = targetIndex;
        else if (pi < progressSelectedIdx && targetIndex >= progressSelectedIdx) progressSelectedIdx--;
        else if (pi > progressSelectedIdx && targetIndex <= progressSelectedIdx) progressSelectedIdx++;
        renderProgress();
      }
      progressDragState = null;
    }
    function progressSelect(i) { progressSelectedIdx = i; renderProgress(); }
    function progressSetView(v) { progressView = v; renderProgress(); }
    function progressSetRange(r) { progressRange = r; renderProgress(); }

    async function confirmDeleteRoutine(id) {

    function updateBuilderEx(i, field, value) {
      if (!builderExercises[i]) return;
      if (field === 'sets') {
        const n = parseInt(value); if (n >= 1 && n <= 10) builderExercises[i].sets = n;
      } else if (field === 'repsLo' || field === 'repsHi') {
        // Two inputs, one stored target: "10-15", or "10" when min and max match (or max is left empty).
        const cur = parseRepRange(builderExercises[i].reps) || { lo: 8, hi: 8 };
        const n = parseInt(value);
        if (!(n > 0)) return;
        let lo = field === 'repsLo' ? n : cur.lo, hi = field === 'repsHi' ? n : cur.hi;
        if (field === 'repsLo' && cur.lo === cur.hi) hi = Math.max(hi, n); // single target: keep max ≥ min
        if (hi < lo) hi = lo;
        builderExercises[i].reps = hi > lo ? `${lo}-${hi}` : `${lo}`;
      }

    /* Builder drag reorder */
    let builderDragState = null;
    function initBuilderDragHandles() {
      document.querySelectorAll('.builder-drag-handle').forEach(h => {
        h.addEventListener('touchstart', onBuilderDragTouch, { passive: false });
        h.addEventListener('mousedown', onBuilderDragMouse);
      });
    }
    function onBuilderDragTouch(e) {
      const bi = parseInt(e.currentTarget.getAttribute('data-bi'));
      e.preventDefault();
      startBuilderDrag(bi, e.touches[0].clientY);
      const mv = (ev) => { ev.preventDefault(); moveBuilderDrag(ev.touches[0].clientY); };
      const en = () => { endBuilderDrag(); document.removeEventListener('touchmove', mv); document.removeEventListener('touchend', en); };
      document.addEventListener('touchmove', mv, { passive: false });
      document.addEventListener('touchend', en);
    }
    function onBuilderDragMouse(e) {
      const bi = parseInt(e.currentTarget.getAttribute('data-bi'));
      e.preventDefault();
      startBuilderDrag(bi, e.clientY);
      const mv = (ev) => moveBuilderDrag(ev.clientY);
      const en = () => { endBuilderDrag(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', en); };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', en);
    }
    function startBuilderDrag(bi, startY) {
      const cards = document.querySelectorAll('.builder-row');
      const card = cards[bi]; if (!card) return;
      triggerHaptic('dragStart');
      const rects = [];
      cards.forEach(c => rects.push(c.getBoundingClientRect()));
      builderDragState = { bi, startY, card, rects };
      card.classList.add('dragging');
    }
    function moveBuilderDrag(clientY) {
      if (!builderDragState) return;
      const { bi, startY, card, rects } = builderDragState;
      const delta = clientY - startY;
      card.style.transform = `translateY(${delta}px)`;
      const dragCenter = rects[bi].top + rects[bi].height / 2 + delta;
      let newIndex = bi;
      for (let i = 0; i < rects.length; i++) {
        if (i === bi) continue;
        const center = rects[i].top + rects[i].height / 2;
        if (bi < i && dragCenter > center) newIndex = i;
        if (bi > i && dragCenter < center && i < newIndex) newIndex = i;
      }
      const cards = document.querySelectorAll('.builder-row');
      cards.forEach((c, i) => {
        if (i === bi) return;
        if (bi < newIndex && i > bi && i <= newIndex) c.style.transform = `translateY(-${rects[bi].height + 8}px)`;
        else if (bi > newIndex && i < bi && i >= newIndex) c.style.transform = `translateY(${rects[bi].height + 8}px)`;
        else c.style.transform = '';
      });
      builderDragState.targetIndex = newIndex;
    }
    function endBuilderDrag() {
      if (!builderDragState) return;
      const { bi, targetIndex } = builderDragState;
      document.querySelectorAll('.builder-row').forEach(c => { c.style.transform = ''; c.classList.remove('dragging'); });
      if (targetIndex !== undefined && targetIndex !== bi) {
        const [moved] = builderExercises.splice(bi, 1);
        builderExercises.splice(targetIndex, 0, moved);
        renderBuilder();
      }
      builderDragState = null;
    }

    function stepRest(d) {
      appData.settings.defaultRestTime = Math.max(15, Math.min(600, (appData.settings.defaultRestTime || 90) + d));

    /* ===== DATA SAFETY =====
       1. storage.persist() at boot, so Chrome won't clear storage under space pressure.
       2. Backups go off the phone through the share sheet (Drive, email, …) — a download would
          only land in Downloads on the same phone. We remember when, and nudge after a month.
       3. Before anything replaces all data (import, delete all), a snapshot is kept so it can be undone. */
    function downloadFile(text, name) {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    }
    async function backupData() {
      if (IS_NATIVE) { if (await shareBackupNative()) markBackedUp(); return; }
      const json = JSON.stringify(appData, null, 2);
      // Plain text on purpose: Android Chrome only shares allow-listed file types, and .json isn't one
      // (canShare() says no and we'd fall back to a download). The content is the same JSON.
      const name = 'workout-backup-' + todayISO() + '.txt';
      const file = new File([json], name, { type: 'text/plain' });
      // Downloading only puts the file in Downloads on this same phone, so say so when that's what happened.
      const fallback = async () => {
        downloadFile(json, name);
        await customAlert('The share menu wasn\'t available, so the backup was saved to Downloads. Move it to Google Drive (or email it to yourself) so it\'s safe if you lose this phone.');
      };
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Workout backup' });
        else await fallback();
      } catch (e) {
        if (e && e.name === 'AbortError') return; // closed the share sheet: nothing was saved
        await fallback();
      }
      markBackedUp();
    }
    // Native: write a real .json to the cache dir and hand it to Android's share sheet.
    async function shareBackupNative() {
      const name = 'workout-backup-' + todayISO() + '.json';
      try {
        const { uri } = await NP.Filesystem.writeFile({ path: name, data: JSON.stringify(appData, null, 2), directory: 'CACHE', encoding: 'utf8' });
        await NP.Share.share({ title: 'Workout backup', files: [uri] });
        return true;
      } catch (e) {
        const msg = (e && e.message) || String(e);
        if (/cancel/i.test(msg)) return false; // closed the share sheet: nothing was saved
        await customAlert('Could not share the backup: ' + msg);
        return false;
      }
    }
    function markBackedUp() {
      appData.settings.lastBackupAt = Date.now();
      saveData(appData);
      triggerHaptic('success');
      if (activeScreen === 'settings') renderSettings();
      else if (activeScreen === 'finish') renderFinish();
    }
    function backupAgeText() {
      const t = appData.settings.lastBackupAt;
      if (!t) return 'never';
      const d = Math.floor((Date.now() - t) / 86400000);
      if (d <= 0) return 'today';
      if (d === 1) return 'yesterday';
      if (d < 14) return `${d} days ago`;
      if (d < 60) return `${Math.round(d / 7)} weeks ago`;
      return `${Math.round(d / 30)} months ago`;
    }
    // Nudge once there's something worth losing and the last backup is over a month old.
    function backupDue() {
      const t = appData.settings.lastBackupAt;
      return appData.sessions.length >= 3 && (!t || Date.now() - t > 30 * 86400000);
    }

    const SNAPSHOT_KEY = 'w-snapshot';
    function takeSnapshot(reason) {
      try {
        const raw = localStorage.getItem('workoutData');
        if (raw) localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({ at: Date.now(), reason, data: raw }));
      } catch (e) {} // storage full: carry on without a snapshot rather than block the action
    }
    function getSnapshot() {
      try { return JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || 'null'); } catch (e) { return null; }
    }
    // Swaps current data and the snapshot, so a restore can itself be undone.
    async function restoreSnapshot() {
      const snap = getSnapshot();
      if (!snap) return;
      let n = 0;
      try { n = (JSON.parse(snap.data).sessions || []).length; } catch (e) { await customAlert('The saved snapshot is unreadable.'); return; }
      const when = new Date(snap.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      if (!await customConfirm(`Restore your data from before the ${snap.reason} on ${when}? (${n} sessions) You can undo this the same way.`)) return;
      const current = localStorage.getItem('workoutData');
      localStorage.setItem('workoutData', snap.data);
      if (current) localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({ at: Date.now(), reason: 'restore', data: current }));
      appData = loadData();
      migrateData();
      showScreen('home');
    }
    function importData(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.sessions || !imported.settings) { await customAlert('Invalid backup file.'); return; }
          if (!await customConfirm('Replace all data with this backup? (' + imported.sessions.length + ' sessions) Your current data is kept so you can undo this in Settings.')) return;
          takeSnapshot('import');
          appData = imported;
          if (!appData.routines) appData.routines = [];
          if (!appData.personalRecords) appData.personalRecords = {};
          migrateData();
          showScreen('home');
        } catch (err) { await customAlert('Could not read file.'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
    async function resetPRs() {
      if (!await customConfirm('Reset all personal records? This recomputes them from session history.')) return;
      rebuildAllPRs(); saveData(appData);
      customAlert('PRs rebuilt from history.');
    }
    async function clearAllData() {
      if (!await customConfirm('Delete ALL workout history? A copy is kept on this phone so you can undo it in Settings.')) return;
      if (!await customConfirm('Are you really sure?')) return;
      takeSnapshot('delete');
      localStorage.removeItem('workoutData');
      clearSessionBackup();
      currentSession = null;
      clearInterval(elapsedInterval);
      appData = { sessions: [], settings: { defaultRestTime: 90, unit: 'kg', hapticsEnabled: true, confettiOnPR: false }, personalRecords: {}, routines: [], programs: [] };
      migrateData();
      showScreen('home');
    }

    function saveNewExercise() {
      const name = (document.getElementById('create-name').value || '').trim();

    // Step picker: common increments as chips, or type your own. The preview shows the jump from your
    // last working weight, so it's clear what the number does.
    let stepEditLastWeight = null;
    function stepPresets() { return appData.settings.unit === 'lbs' ? [1, 2.5, 5, 10] : [0.5, 1, 1.25, 2, 2.5, 5]; }
    function lastWorkingWeight(name) {
      for (let i = appData.sessions.length - 1; i >= 0; i--) {
        const e = appData.sessions[i].exercises.find(x => x.name === name);
        const ws = e ? e.sets.filter(st => st.completed && !st.drop).map(st => Number(st.weight) || 0) : [];
        if (ws.length && Math.max(...ws) > 0) return Math.max(...ws);
      }
      return null;
    }
    function stepPickerHTML(step) {
      return `<div class="field">
            <span class="field-label">Weight step</span>
            <div class="step-picker" id="step-picker">
              ${stepPresets().map(v => `<button class="chip${v === step ? ' on' : ''}" data-v="${v}" onclick="setStepInput(${v})">+${v}</button>`).join('')}
              <input id="edit-step" type="number" step="0.25" min="0.5" inputmode="decimal" value="${step}" oninput="updateStepPreview()" aria-label="Custom step"/>
            </div>
            <div class="step-preview" id="step-preview"></div>
          </div>`;
    }
    function setStepInput(v) {
      const el = document.getElementById('edit-step'); if (!el) return;
      el.value = v;
      updateStepPreview();
    }
    function readStepInput() {
      const v = parseFloat((document.getElementById('edit-step') || {}).value);
      return v >= 0.5 ? +v.toFixed(2) : null;
    }
    function updateStepPreview() {
      const step = readStepInput();
      document.querySelectorAll('#step-picker .chip').forEach(c => c.classList.toggle('on', Number(c.dataset.v) === step));
      const el = document.getElementById('step-preview'); if (!el) return;
      const unit = appData.settings.unit;
      if (!step) { el.textContent = 'At least 0.5'; return; }
      el.innerHTML = stepEditLastWeight
        ? `Next jump: ${stepEditLastWeight} → <b>${+(stepEditLastWeight + step).toFixed(2)} ${unit}</b> once you hit the top of the range`
        : `Adds ${step} ${unit} once you hit the top of the range. Also the ± on the weight buttons.`;
    }

    async function deleteCustomExercise(exerciseId) {
      if (!await customConfirm('Delete this custom exercise?')) return;
      appData.customExercises = appData.customExercises.filter(e => e.id !== exerciseId);
      delete appData.exerciseOverrides[exerciseId];
      const idx = EXERCISE_LIBRARY.findIndex(e => e.id === exerciseId);
      if (idx !== -1) EXERCISE_LIBRARY.splice(idx, 1);
      delete LIBRARY_MAP[exerciseId];
      saveData(appData); closeSheet('exedit-overlay'); renderBestiary();
    }

    /* ========== UPDATES (native) ========== */
    // Checks the repo's latest GitHub Release; a newer tag with an .apk shows a row on Home.
    const UPDATE_API = 'https://api.github.com/repos/nbilic/w-tracker/releases/latest';
    const UPDATE_CHECK_EVERY = 6 * 3600 * 1000;
    let availableUpdate = null, updateBusy = false;
    function isNewerVersion(a, b) {
      const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
      for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d > 0; }
      return false;
    }
    // The last release seen is cached, so the Home row survives restarts between checks.
    function applyCachedRelease() {
      let rel = null;
      try { rel = JSON.parse(localStorage.getItem('w-update') || 'null'); } catch (e) {}
      availableUpdate = rel && APP_VERSION && isNewerVersion(rel.version, APP_VERSION) ? rel : null;
    }
    async function fetchLatestRelease() {
      const res = await fetch(UPDATE_API, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if (!res.ok) throw new Error('GitHub said ' + res.status);
      const r = await res.json();
      const apk = (r.assets || []).find(a => /\.apk$/i.test(a.name));
      localStorage.setItem('w-update-checked', String(Date.now()));
      if (!apk) return;
      localStorage.setItem('w-update', JSON.stringify({
        version: String(r.tag_name).replace(/^v/, ''), url: apk.browser_download_url, size: apk.size,
        notes: (r.body || '').trim(),
      }));
    }
    // Automatic: on launch/resume, at most every 6 h, never mid-workout.
    async function checkForUpdate() {
      if (!IS_NATIVE || !APP_VERSION) return;
      applyCachedRelease();
      const last = Number(localStorage.getItem('w-update-checked') || 0);
      if (!currentSession && Date.now() - last > UPDATE_CHECK_EVERY) {
        try { await fetchLatestRelease(); applyCachedRelease(); } catch (e) {} // offline: try next time
      }
      if (activeScreen === 'home') renderHome();
      else if (activeScreen === 'settings') renderSettings();
    }
    async function checkForUpdateNow() {
      if (!APP_VERSION) return;
      try { await fetchLatestRelease(); applyCachedRelease(); }
      catch (e) { await customAlert("Couldn't check for updates. Are you online?"); return; }
      if (activeScreen === 'settings') renderSettings();
      if (availableUpdate) openUpdateSheet();
      else await customAlert(`You're on the latest version (v${APP_VERSION}).`);
    }
    function updateStatusText() {
      const cur = 'v' + (APP_VERSION || '?');
      if (availableUpdate) return `${cur} · v${escapeHtml(availableUpdate.version)} available`;
      const last = Number(localStorage.getItem('w-update-checked') || 0);
      if (!last) return cur + ' · tap to check';
      return `${cur} · up to date · checked ${new Date(last).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
    }
    function openUpdateSheet() {
      const u = availableUpdate; if (!u) return;
      const mb = u.size ? ` · ${(u.size / 1048576).toFixed(1)} MB` : '';
      document.getElementById('update-sheet').innerHTML = `
        <div class="sheet-grab"></div>
        <div class="row-between" style="margin-bottom:10px">
          <div>
            <div class="eyebrow eyebrow-accent" style="margin-bottom:3px">Update available</div>
            <div class="mono" style="font-size:11px;color:var(--ink-3)">v${escapeHtml(APP_VERSION)} → v${escapeHtml(u.version)}${mb}</div>
          </div>
          <button class="icon-btn" onclick="closeSheet('update-overlay')" style="width:32px;height:32px">${svg('x', 14)}</button>
        </div>
        <div class="update-notes">${escapeHtml(u.notes || 'No release notes.')}</div>
        <div class="mono" style="font-size:11px;color:var(--ink-3);margin-bottom:12px">Your data stays as it is. Android asks you to confirm the install.</div>
        <button id="update-install-btn" class="btn btn-primary btn-block" style="padding:14px;font-size:14px" onclick="installUpdate()">${updateBusy ? 'Downloading…' : 'Install'}</button>`;
      openSheet('update-overlay');
    }
    function setUpdateButton(text) { const b = document.getElementById('update-install-btn'); if (b) b.textContent = text; }
    async function installUpdate() {
      if (!availableUpdate || updateBusy) return;
      const AI = NP.ApkInstaller;
      try {
        let { allowed } = await AI.canInstall();
        if (!allowed) {
          if (!await customConfirm('Android needs your OK, once, to let Workout Tracker install its own updates. Open that setting? Turn on "Allow from this source", then come back.')) return;
          ({ allowed } = await AI.openInstallSettings());
          if (!allowed) return;
        }
        writeMirror(); // the app restarts after installing; flush any pending save first
        updateBusy = true;
        setUpdateButton('Downloading…');
        await AI.downloadAndInstall({ url: availableUpdate.url });
      } catch (e) {
        await customAlert("The update didn't install: " + ((e && e.message) || e) + '. You can also download it from the Releases page on GitHub.');
      } finally {
        updateBusy = false;
        setUpdateButton('Install');
      }
    }

    // Rest timer state. Declared before boot: session recovery resumes a running rest timer,
    // and touching these before their declaration throws (which used to wipe the backup).
    let restInterval = null, isResting = false, restStartedAt = 0, restDuration = 0, restExName = 'REST', restKey = '', restSet = 0;

    /* ========== BOOT ========== */
    (function boot() {
      // Onboarding gate
      if (!localStorage.getItem('w-onboarded')) {
        showScreen('onboarding');
      } else {
        showScreen('home');
      }
      // Service worker (web only; the native app bundles its files)
      if (!IS_NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      // Ask for persistent storage so Chrome won't clear the data under space pressure (granted silently for installed apps)
      if (!IS_NATIVE && navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
      }
      // Session recovery
      checkSessionRecovery();
      if (IS_NATIVE) setupNative();
    })();

    async function setupNative() {
      // Hardware back: close a sheet/dialog → go back a screen → leave the app from home.
      NP.App.addListener('backButton', ({ canGoBack }) => {
        if (closeAnyOpenSheet() || closeAnyOpenDialog()) return;
        if (activeScreen === 'home' || (activeScreen === 'onboarding' && !guideFromMenu)) { NP.App.minimizeApp(); return; }
        if (canGoBack) history.back(); else showScreen('home');
      });
      // Flush the pending mirror write before Android may kill the backgrounded app.
      NP.App.addListener('pause', () => { if (mirrorTimer) writeMirror(); });
      // Back in the app: a "Rest over" notification in the tray has done its job.
      NP.App.addListener('resume', () => { NP.LocalNotifications.removeAllDeliveredNotifications().catch(() => {}); });
      NP.App.getInfo().then(info => {
        APP_VERSION = info.version;
        if (activeScreen === 'menu') renderMenu();
        else if (activeScreen === 'settings') renderSettings();
        checkForUpdate();
      }).catch(() => {});
      NP.App.addListener('resume', () => checkForUpdate());
      // +30 / Skip on the workout notification drive the same rest timer as the in-app buttons.
      NP.WorkoutNative.addListener('restAction', ({ action }) => {
        if (!isResting) { queueNativeSync(); return; }
        if (action === 'add30') adjustRest(30);
        else if (action === 'skip') dismissRest();
      });
      // Opened from a shortcut or the widget (also delivered on a cold start).
      NP.App.addListener('appUrlOpen', ({ url }) => handleAppUrl(url));
      queueNativeSync();
      NP.ApkInstaller.addListener('progress', ({ percent }) => setUpdateButton(`Downloading… ${percent}%`));
      // Session recovery may already have resumed a rest; reschedule it now the channel exists.
      setupRestNotifications().then(() => { if (isResting) scheduleRestAlarm(); }).catch(() => {});
      await offerMirrorRestore();
      mirrorReady = true;
      writeMirror();
    }

    // Fresh install (or cleared app data) but Auto Backup brought back the mirror file: offer it.
    async function offerMirrorRestore() {
      if (HAD_DATA) return;
      let saved;
      try {
        const res = await NP.Filesystem.readFile({ path: MIRROR_FILE, directory: 'DATA', encoding: 'utf8' });
        saved = JSON.parse(res.data);
      } catch (e) { return; } // no mirror file: nothing to restore
      if (!saved || !saved.sessions || !saved.sessions.length || !saved.settings) return;
      const n = saved.sessions.length;
      if (!await customConfirm(`Found a backup of your data on this phone (${n} session${n === 1 ? '' : 's'}). Restore it?`)) return;
      localStorage.setItem('workoutData', JSON.stringify(saved));
      localStorage.setItem('w-onboarded', '1');
      appData = loadData();
      migrateData();
      showScreen('home');
    }

    function checkSessionRecovery() {
      const raw = localStorage.getItem('workoutBackup');
      if (!raw) return;
      try {
        const backup = JSON.parse(raw);
        if (!backup || !backup.session || !backup.session.exercises || !backup.timestamp) { clearSessionBackup(); return; }
        if (Date.now() - backup.timestamp > 4 * 60 * 60 * 1000) { clearSessionBackup(); return; }
        currentSession = backup.session;
        clearInterval(elapsedInterval);
        elapsedInterval = setInterval(() => {
          const el = document.getElementById('elapsed-display');
          if (el) el.textContent = formatTime(getElapsedSeconds());
        }, 1000);
        if (activeScreen === 'home') renderHome();
        resumeRestTimer();
      } catch (e) { clearSessionBackup(); }
    }

    function resumeRestTimer() {
      if (!currentSession || !currentSession.restStartedAt || !currentSession.restDuration) return;
      restStartedAt = currentSession.restStartedAt;
      restDuration = currentSession.restDuration;
      restExName = currentSession.restExName || 'REST';
      restKey = currentSession.restKey || '';
      restSet = currentSession.restSet || 0;
      const remaining = Math.max(0, restDuration - Math.floor((Date.now() - restStartedAt) / 1000));
      if (remaining <= 0) { clearRestState(); return; }
      isResting = true;
      scheduleRestAlarm();
      clearInterval(restInterval);
      restInterval = setInterval(() => {
        const rem = getRestRemaining();
        if (rem <= 1) cancelAlarmIfWatching();
        if (rem <= 0) { clearInterval(restInterval); restFinished(); }
        if (activeScreen === 'workout') updateRestRing();
      }, 1000);
    }
    function getRestRemaining() {
      if (!restStartedAt || !restDuration) return 0;
      return Math.max(0, restDuration - Math.floor((Date.now() - restStartedAt) / 1000));
    }
    function clearRestState() {
      // Only a rest cleared early has a pending alarm to cancel; once it has fired, leave the
      // notification up (it's cleared when the app comes back to the foreground).
      if (restStartedAt && Date.now() < restStartedAt + restDuration * 1000) cancelRestAlarm();
      queueNativeSync();
      restStartedAt = 0; restDuration = 0; isResting = false;
      if (currentSession) { delete currentSession.restStartedAt; delete currentSession.restDuration; delete currentSession.restExName; delete currentSession.restKey; delete currentSession.restSet; }
    }
    function dismissRest() {
      clearInterval(restInterval); clearRestState();
      if (activeScreen === 'workout') renderRestBar();
    }
    // App on screen at the end of a rest: the in-app beep covers it, so drop the notification.
    function cancelAlarmIfWatching() {
      if (IS_NATIVE && document.visibilityState === 'visible') cancelRestAlarm();
    }
    function restFinished() {
      // Native: if the rest ended a while ago (phone locked/app in background), the scheduled
      // alarm already went off, so don't beep again on return.
      const lateMs = Date.now() - (restStartedAt + restDuration * 1000);
      dismissRest();
      if (IS_NATIVE && (document.visibilityState === 'hidden' || lateMs > 3000)) return;
      triggerHaptic('restTimerDone');
      sendRestNotification();
      try {
        unlockAudio();
        const ctx = audioCtx;
        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880; gain.gain.value = 0.3;
          osc.start(ctx.currentTime + i * 0.25); osc.stop(ctx.currentTime + i * 0.25 + 0.15);
        }
      } catch (e) {}
    }
  </script>
</body>
