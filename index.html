<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <title>Workout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root[data-theme="dark"] {
      --bg: #0e0d0c;
      --surface: #15140f;
      --surface-2: #1c1a15;
      --surface-3: #25221c;
      --line: rgba(255, 240, 220, 0.06);
      --line-2: rgba(255, 240, 220, 0.10);
      --ink: #f5f1ec;
      --ink-2: #b4ada4;
      --ink-3: #85807a;
      --ink-4: #5c5851;
      --accent: #e97a52;
      --accent-ink: #1a0f08;
      --accent-2: #b77bd9;
      --accent-soft: rgba(233, 122, 82, 0.14);
      --accent-line: rgba(233, 122, 82, 0.3);
      --chart-line: #dc6c45; /* accent one step darker: keeps chart marks inside the dark-mode lightness band */
      --good: #8bb98a;
      --good-soft: rgba(139, 185, 138, 0.14);
      --warn: #d4a258;
      --bad: #d07670;
      --gold: #d4a258;
      --info: #7ea7cc;
      --info-soft: rgba(126, 167, 204, 0.18);
      --info-line: rgba(126, 167, 204, 0.38);
      --shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    }
    :root[data-theme="light"] {
      --bg: #f7f4ef;
      --surface: #ffffff;
      --surface-2: #f0ebe3;
      --surface-3: #e6e0d5;
      --line: rgba(30, 22, 12, 0.08);
      --line-2: rgba(30, 22, 12, 0.14);
      --ink: #1b1815;
      --ink-2: #55504a;
      --ink-3: #807a72;
      --ink-4: #a6a09a;
      --accent: #c25a34;
      --accent-ink: #ffffff;
      --accent-2: #8a4fb0;
      --accent-soft: rgba(194, 90, 52, 0.12);
      --accent-line: rgba(194, 90, 52, 0.32);
      --chart-line: #c25a34;
      --good: #4a8749;
      --good-soft: rgba(74, 135, 73, 0.12);
      --warn: #a57c2f;
      --bad: #a54a45;
      --gold: #a57c2f;
      --info: #3f6f94;
      --info-soft: rgba(63, 111, 148, 0.12);
      --info-line: rgba(63, 111, 148, 0.34);
      --shadow: 0 30px 60px -20px rgba(40,25,10,0.12);
    }

    html, body {
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--ink);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: clip; /* not hidden: hidden makes a scroll container and breaks position: sticky */
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #confetti-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
    }

    /* ===== APP SHELL ===== */
    .app-root {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto;
      position: relative;
    }
    .app-body {
      flex: 1; overflow-x: clip;
      padding-bottom: calc(80px + env(safe-area-inset-bottom, 0));
    }
    .screen-wrap { display: none; }
    .screen-wrap.active { display: block; animation: fade-up .28s ease-out both; }
    .screen { padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    #workout-body.screen { gap: 0; }

    /* ===== TAB BAR ===== */
    .app-tabs {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: calc(64px + env(safe-area-inset-bottom, 0));
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: saturate(140%) blur(18px);
      -webkit-backdrop-filter: saturate(140%) blur(18px);
      display: grid; grid-template-columns: repeat(5, 1fr);
      z-index: 50;
    }
    .app-tab {
      background: none; border: none; padding: 10px 0 8px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-4); cursor: pointer;
      transition: color .15s;
    }
    .app-tab.on { color: var(--accent); }
    .app-tab svg { width: 22px; height: 22px; stroke-width: 1.6; }
    .app-tab.on svg { stroke-width: 2; }
    .app-tabs.hidden { display: none; }

    /* ===== SHARED LANGUAGE ===== */
    .eyebrow {
      font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-3); font-weight: 500;
    }
    .eyebrow-accent { color: var(--accent); }
    .mono { font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; }
    .serif { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      position: relative;
    }
    .card-tight { padding: 14px 16px; border-radius: 16px; }
    .divider { height: 1px; background: var(--line); width: 100%; }

    .h-stack { display: flex; align-items: center; gap: 10px; }
    .v-stack { display: flex; flex-direction: column; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: var(--surface-2); color: var(--ink-2);
      font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--line);
    }
    .pill-accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
    .pill-good { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }

    .btn {
      font-family: 'Geist', sans-serif; font-weight: 500; font-size: 15px;
      padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); cursor: pointer;
      transition: transform .08s, background .15s, border-color .15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .btn-ghost { background: transparent; color: var(--ink-2); border: none; }
    .btn-block { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-danger { color: var(--bad); }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-2); cursor: pointer; flex-shrink: 0;
      transition: transform .08s, background .15s;
    }
    .icon-btn:active { transform: scale(0.96); background: var(--surface-2); color: var(--ink); }
    .icon-btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    .screen-title {
      font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px;
      letter-spacing: -0.02em; line-height: 1.04;
    }
    .screen-title em { font-style: italic; color: var(--accent); }

    .badge-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .badge-dot-a { background: var(--accent); }
    .badge-dot-b { background: var(--accent-2); }

    /* ===== MOTION ===== */
    @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fade-up 0.28s ease-out both; }
    @keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes dialog-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    /* ===== HOME ===== */
    .home-header { padding-top: 4px; }
    .home-streak-row { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
    .home-next-card {
      padding: 22px;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--line); border-radius: 20px;
    }
    .home-next-eyebrow {
      font-size: 16px; letter-spacing: 0.14em; margin-bottom: 10px;
      display: block;
    }
    .home-next-meta { font-size: 12px; color: var(--ink-3); margin-bottom: 18px; font-family: 'Geist Mono', monospace; }
    .home-next-bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
    .home-next-bar { height: 3px; background: var(--surface-3); border-radius: 2px; }
    .home-next-bar.on { background: var(--accent); }

    /* Calendar */
    .cal-dow { text-align: center; font-size: 10px; color: var(--ink-4);
      padding: 0 0 6px; font-family: 'Geist Mono', monospace; letter-spacing: 0.08em; }
    .cal-day {
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500;
      color: var(--ink-2);
      border-radius: 8px; border: 1px solid transparent;
    }
    .cal-day.today { color: var(--accent); font-weight: 700;
      background: var(--accent-soft); border-color: var(--accent-line); }
    .cal-day.future { color: var(--ink-4); }
    .cal-day .cal-dots { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 2px; pointer-events: none; }
    .cal-day .cal-dots .badge-dot { width: 4px; height: 4px; }

    /* PR rows (home) */
    .pr-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .pr-row:last-child { border-bottom: none; }
    .pr-row-name { font-size: 14px; font-weight: 500; }
    .pr-row-meta { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
    .pr-row-weight { font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; text-align: right; }
    .pr-row-weight .unit { font-size: 11px; color: var(--ink-3); margin-left: 2px; }

    /* ===== ACTIVE WORKOUT ===== */
    .workout-sticky {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: 6px 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    .workout-name {
      font-family: 'Fraunces', serif; font-weight: 600;
      font-size: 22px; letter-spacing: -0.015em; line-height: 1.1;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .elapsed-row {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .elapsed-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--good); flex-shrink: 0;
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent);
      animation: pulse-dot 2.2s ease-out infinite;
    }
    .elapsed-time {
      font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600;
      letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .elapsed-label {
      font-family: 'Geist Mono', monospace; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-3); margin-left: 2px;
    }
    @keyframes pulse-dot {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); }
      70%  { box-shadow: 0 0 0 8px color-mix(in srgb, var(--good) 0%, transparent); }
      100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 0%, transparent); }
    }

    /* Collapsed exercises are plain rows; only the one you're on is a lifted card. */
    .ex-card {
      background: transparent;
      border-bottom: 1px solid var(--line);
      padding: 14px 4px;
    }
    .ex-card.expanded {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      /* Grows outward (negative margin = padding − row padding) so its content stays aligned with the rows */
      padding: 16px 16px 14px 16px;
      margin: 8px -12px;
      box-shadow: 0 10px 28px -14px rgba(0,0,0,0.45);
    }
    .ex-card.done:not(.expanded) { opacity: 0.55; }
    .ex-ring { width: 24px; height: 24px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .ex-ring svg { width: 24px; height: 24px; }
    .ex-ring-arc { transition: stroke-dashoffset .45s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .ex-ring.done { border-radius: 50%; background: var(--good); color: var(--bg); }
    .ex-ring.done svg { width: 13px; height: 13px; }
    .ex-ring.pop { animation: ring-pop .3s cubic-bezier(0.2, 0.8, 0.2, 1.4) both; }
    @keyframes ring-pop { from { transform: scale(0.6); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
    .session-progress { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
    .sp-bar { flex: 1; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
    .sp-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .35s ease; }
    .sp-label { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3);
      text-transform: uppercase; white-space: nowrap; }
    .ex-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .ex-drag { color: var(--ink-4); cursor: grab; touch-action: none; flex-shrink: 0;
      display: inline-flex; padding: 8px 4px 8px 0; margin: -8px -4px -8px -2px; }
    .ex-card.dragging { position: relative; z-index: 20; background: var(--surface-2); border-radius: 12px;
      box-shadow: var(--shadow); opacity: 1 !important; }
    .ex-card.shifting { transition: transform .15s ease; }
    .ex-name { font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 8px; }
    .ex-sub { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-3);
      margin-top: 3px; letter-spacing: 0.04em; }

    .ex-body { margin-top: 12px; }
    .ex-bump { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: var(--ink-3);
      margin: -4px 0 12px; }
    .ex-bump.earned { color: var(--accent); font-weight: 600; }
    .exs-section { margin-bottom: 18px; }
    .exs-today { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 18px; }
    .exs-today-head { font-family: 'Geist Mono', monospace; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .exs-today-focus { font-size: 14px; color: var(--accent); font-weight: 500; line-height: 1.4; }
    .exs-today-next { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
    .exs-today-next b { color: var(--ink); font-weight: 600; }
    .exs-pr { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; color: var(--gold);
      border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
    .exs-takeaway { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 600; }
    .exs-note { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-bottom: 16px; cursor: pointer;
      padding-left: 10px; border-left: 2px solid var(--line-2); white-space: pre-wrap; }
    .exs-add-note { background: none; border: none; padding: 6px 0 2px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .exs-add-note span { color: var(--ink-4); margin-left: 4px; }
    .exs-show-all { background: none; border: none; padding: 10px 0 0; font: inherit; font-size: 12px; color: var(--ink-3);
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .exs-hint { color: var(--ink-4); }
    .exs-recent { padding: 9px 0; border-bottom: 1px solid var(--line); }
    .exs-recent-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
    .exs-recent-sets { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 3px; }
    .exs-chart { width: 100%; height: auto; display: block; overflow: visible; }
    .exs-grid { stroke: var(--line); stroke-width: 1; }
    .exs-axis, .exs-reps { font-family: 'Geist Mono', monospace; font-size: 9px; fill: var(--ink-3); }
    .exs-line { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .exs-dot { fill: var(--chart-line); stroke: var(--surface); stroke-width: 2; }
    .exs-dot.on { stroke-width: 2.5; }
    .exs-chart-cap { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-2); margin-top: 6px; }
    .exs-unit { color: var(--ink-4); }
    .exs-drop { color: var(--accent-2); }
    .exs-recent:last-child { border-bottom: none; }
    .exs-res { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-4); }
    .exs-recent.up .exs-res { color: var(--accent); font-weight: 600; }
    .exs-recent.down .exs-res { color: var(--ink-3); }
    .exhist-note { width: 100%; resize: none; margin-bottom: 14px; font-size: 13px; line-height: 1.4; }
    .set-head-row {
      display: grid; grid-template-columns: 20px 1fr 52px 32px; gap: 6px; margin-bottom: 6px;
      padding: 0 2px;
    }
    .set-head-row .eyebrow { font-size: 9px; }
    .set-head-row .eyebrow.num-col { text-align: center; }
    .set-head-row .eyebrow.reps-col { text-align: center; white-space: nowrap; }

    .set-row {
      display: grid; grid-template-columns: 20px 1fr 52px 32px; gap: 6px;
      align-items: center;
      padding: 4px 2px; margin-bottom: 2px; border-radius: 8px;
    }
    .set-num { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-4); text-align: center; }
    .weight-cell {
      display: grid; grid-template-columns: 30px 1fr 30px; gap: 4px; align-items: center;
    }
    .w-adj {
      height: 30px; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--line);
      color: var(--ink-2); font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 600;
      cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
    }
    .w-adj:active { transform: scale(0.94); background: var(--surface-3); }
    .set-input {
      width: 100%; height: 30px; text-align: center; background: var(--surface-2);
      border: 1px solid var(--line); color: var(--ink);
      border-radius: 8px; padding: 0 4px; line-height: 1;
      font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 600;
      letter-spacing: -0.01em; outline: none;
      -moz-appearance: textfield;
    }
    .set-input::-webkit-outer-spin-button, .set-input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .set-input:focus { border-color: var(--info-line); background: var(--surface-3); }
    .set-input.done { color: var(--ink); }
    .set-check-btn {
      width: 30px; height: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1.5px solid var(--ink-4);
      color: var(--ink-4); cursor: pointer;
    }
    .set-check-btn.done { background: var(--good); border: none; color: var(--bg); }
    .set-check-btn:active { transform: scale(0.94); }

    .ex-actions { display: flex; gap: 6px; margin-top: 10px; }
    .add-set-btn {
      flex: 1; background: transparent; border: 1px dashed var(--line-2);
      color: var(--ink-3); padding: 8px 0; border-radius: 10px;
      font-family: 'Geist', inherit; font-size: 12px; cursor: pointer;
    }
    /* Drop sets: one-off lighter extras, marked in light purple everywhere they appear */
    .add-set-btn.drop { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); }
    .set-row.drop { background: color-mix(in srgb, var(--accent-2) 9%, transparent); }
    .set-row.drop .set-num { color: var(--accent-2); font-weight: 700; }
    .set-row.drop .set-input { color: var(--accent-2); }
    .ex-pr-strip {
      font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-3);
      margin-top: 12px; padding: 6px 10px;
      background: var(--surface-2); border-radius: 8px; letter-spacing: 0.06em;
    }

    /* Rest bar: the whole bar is the timer (fill empties right to left) */
    .rest-bar {
      position: relative; overflow: hidden;
      background: var(--surface); border: 1px solid var(--accent-line);
      border-radius: 14px; margin-top: 6px;
    }
    .rest-fill {
      position: absolute; top: 0; bottom: 0; left: 0;
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      transition: width 1s linear;
    }
    .rest-content { position: relative; display: flex; align-items: center; gap: 14px; padding: 10px 12px; }
    .rest-time { font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      color: var(--accent); min-width: 62px; }
    .rest-label { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 3px; font-weight: 500; }
    .rest-name { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rest-actions { display: flex; gap: 4px; }
    .rest-actions .icon-btn { width: 32px; height: 32px; border-radius: 10px; }
    .rest-add-label { font-family: 'Geist Mono', monospace; font-size: 10px; }

    /* ===== MODAL / SHEET (centered) ===== */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .sheet-overlay.active { display: flex; }
    .sheet {
      background: var(--surface); border-radius: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      animation: dialog-in .2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      max-height: 85vh; overflow-y: auto;
      max-width: 440px; width: 100%;
      box-shadow: var(--shadow);
    }
    .sheet-grab { display: none; }
    /* Form field row used inside edit sheets */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-family: 'Geist Mono', monospace; font-size: 10px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; }

    /* ===== SEGMENTED + TOGGLE + STEPPER ===== */
    .setting-group { }
    .setting-row {
      display: flex; align-items: center; gap: 10px; padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { flex: 1; font-size: 14px; font-weight: 500; }
    .setting-value { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-3); }

    .toggle {
      width: 42px; height: 24px; border-radius: 999px;
      background: var(--surface-3); border: none; cursor: pointer;
      position: relative; transition: background .15s; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff;
      transition: left .18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .toggle.on::after { left: 21px; }

    .segmented {
      display: flex; background: var(--surface-2); border-radius: 10px;
      padding: 3px; border: 1px solid var(--line); gap: 2px;
    }
    .segmented button {
      padding: 5px 12px; font-family: 'Geist Mono', monospace; font-size: 11px;
      border-radius: 7px; background: transparent; color: var(--ink-3);
      border: none; cursor: pointer; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .segmented button.on { background: var(--accent); color: var(--accent-ink); }

    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper .icon-btn { width: 28px; height: 28px; border-radius: 8px; }
    .stepper-val { font-family: 'Geist Mono', monospace; font-size: 13px; min-width: 48px; text-align: center; }

    /* ===== DIALOG ===== */
    .dialog-overlay {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.6); display: none;
      align-items: center; justify-content: center; padding: 24px;
    }
    .dialog-overlay.active { display: flex; }
    .dialog-box {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 22px; max-width: 340px; width: 100%;
      animation: dialog-in .15s ease-out both;
    }
    .dialog-msg { font-size: 14px; line-height: 1.5; margin-bottom: 18px; color: var(--ink); }
    .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .dialog-btn {
      padding: 10px 16px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .dialog-btn-cancel { background: var(--surface-2); color: var(--ink-2); }
    .dialog-btn-confirm { background: var(--accent); color: var(--accent-ink); }

    /* ===== HISTORY ===== */
    .hist-item {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 0; overflow: hidden;
    }
    .hist-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
    .hist-title { font-size: 14px; font-weight: 500; }
    .hist-meta { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-3);
      margin-top: 3px; letter-spacing: 0.06em; }
    .hist-meta .pr { color: var(--accent); }
    .hist-chev { transition: transform .2s; color: var(--ink-4); flex-shrink: 0; }
    .hist-item.open .hist-chev { transform: rotate(180deg); }
    .hist-detail { display: none; padding: 0 18px 18px; border-top: 1px solid var(--line); padding-top: 14px; }
    .hist-item.open .hist-detail { display: block; }
    .hist-delete {
      background: none; border: none; color: var(--ink-4); cursor: pointer; padding: 4px;
    }
    .hist-notes {
      font-size: 12px; color: var(--ink-2); margin-top: 10px;
      padding: 10px 12px; background: var(--surface-2); border-radius: 10px;
      font-style: italic;
    }

    /* ===== PROGRESS ===== */
    .chip-picker {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .chip {
      flex-shrink: 0; padding: 8px 14px; border-radius: 999px;
      background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
      font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    }
    .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .step-picker { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .step-picker input[type=number] { width: 76px; text-align: center; padding: 7px 8px; border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 13px; }
    .step-preview { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
    .step-preview b { color: var(--ink); font-weight: 600; }

    .prog-hero .serif { font-size: 22px; }
    .prog-view-tabs { display: flex; gap: 4px; margin-top: 16px; }
    .prog-range { display: flex; gap: 2px; margin-top: 14px; }
    .prog-range button { flex: 1; background: none; border: none; padding: 6px 0; border-radius: 8px; cursor: pointer;
      font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); }
    .prog-range button.on { background: var(--surface-2); color: var(--ink); }
    .prog-summary { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; padding: 0 4px; }
    .prog-view-tabs button {
      flex: 1; padding: 8px 0; border-radius: 8px;
      background: transparent; color: var(--ink-3); border: 1px solid var(--line);
      font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    }
    .prog-view-tabs button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }


    .ex-list-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      transition: transform .08s;
    }
    .ex-list-row:last-child { border-bottom: none; }
    .ex-list-row.on { background: var(--surface-2); }
    .ex-list-row.dragging { opacity: 0.95; z-index: 20; box-shadow: var(--shadow); }
    .ex-list-drag { color: var(--ink-3); cursor: grab; touch-action: none; padding: 4px; margin: -4px -8px -4px -8px; display: inline-flex; align-items: center; flex-shrink: 0; }
    .ex-list-drag:active { cursor: grabbing; color: var(--ink); }
    .ex-list-name { font-size: 13px; font-weight: 500; }
    .ex-list-sub { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-3); margin-top: 2px; }

    /* ===== ROUTINES / BUILDER ===== */
    .routine-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; padding: 18px;
    }
    .routine-exercise-peek { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .builder-row {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
      transition: transform .08s;
    }
    .builder-row.dragging { opacity: 0.9; box-shadow: var(--shadow); z-index: 30; }
    .builder-drag-handle { color: var(--ink-4); cursor: grab; touch-action: none; padding: 4px; }
    .builder-field-input {
      width: 36px; background: var(--surface-2); border: 1px solid var(--line);
      color: var(--ink); padding: 6px 4px; border-radius: 8px; text-align: center;
      font-family: 'Geist Mono', monospace; font-size: 13px; outline: none;
    }
    /* Scoped so it outranks the global input[type=number] rule (declared later), whose 12px padding clipped two-digit values */
    .builder-row input.builder-field-input { -moz-appearance: textfield; appearance: textfield; padding: 6px 2px; border-radius: 8px;
      font-family: 'Geist Mono', monospace; font-size: 13px; }
    .builder-field-input::-webkit-outer-spin-button, .builder-field-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .builder-field-input::placeholder { color: var(--ink-4); font-size: 11px; }
    .builder-row .builder-drag-handle { margin-top: 1px; }
    .builder-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
    .builder-type { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-3); margin-top: 2px; }
    .builder-fields { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .builder-unit { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--ink-4); }
    .builder-remove-btn { background: none; border: none; color: var(--ink-4); cursor: pointer; padding: 4px; }
    .dashed-btn {
      background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3);
      padding: 14px; border-radius: 14px;
      font-family: inherit; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .builder-name-input {
      width: 100%; background: var(--surface); border: 1px solid var(--line);
      color: var(--ink); padding: 16px 20px; border-radius: 14px;
      font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
      letter-spacing: -0.01em; outline: none;
    }

    /* ===== MENU ===== */
    .menu-row {
      display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-icon-box {
      width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0;
    }
    .menu-row-name { font-size: 14px; font-weight: 500; }
    .menu-row-sub { font-family: 'Geist Mono', monospace; font-size: 10px;
      color: var(--ink-3); margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }

    /* ===== ONBOARDING ===== */
    /* How it works: first-run guide, also under More */
    #screen-onboarding .screen { min-height: 100vh; min-height: 100dvh; }
    .guide-list { display: flex; flex-direction: column; }
    .guide-item { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
    .guide-item:first-child { border-top: none; padding-top: 4px; }
    .guide-num { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--accent); padding-top: 3px; min-width: 18px; }
    .guide-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .guide-body { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
    .guide-body b { color: var(--ink); font-weight: 500; }

    /* ===== FINISH ===== */
    #screen-finish .screen { min-height: 80vh; justify-content: center; }
    .finish-head {
      text-align: center; padding: 8px 0;
    }
    .finish-title {
      font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600;
      letter-spacing: -0.015em; line-height: 1.1; margin: 4px 0 6px;
    }
    .finish-title em { font-style: italic; color: var(--accent); }
    .recap-list { margin: 8px 0; }
    .recap-row { border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .recap-row:last-child { border-bottom: none; }
    .recap-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 4px; }
    .recap-name { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recap-res { display: flex; align-items: center; font-family: 'Geist Mono', monospace; font-size: 12px;
      color: var(--ink-4); white-space: nowrap; }
    .recap-row.up .recap-res { color: var(--accent); font-weight: 600; }
    .recap-row.down .recap-res { color: var(--ink-3); }
    .recap-star { color: var(--gold); margin-right: 7px; }
    .recap-chev { display: inline-flex; margin-left: 8px; color: var(--ink-4); opacity: 0.6; transition: transform .2s ease; }
    .recap-row.open .recap-chev { transform: rotate(90deg); opacity: 1; }
    .recap-detail { display: none; margin: -4px 0 14px; padding: 12px 14px 13px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--line); }
    .recap-row.open .recap-detail { display: block; animation: fade-up .22s ease-out both; }
    .recap-meta { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 10px; }
    .recap-grid { display: grid; grid-template-columns: 42px repeat(var(--n), auto); justify-content: start;
      align-items: center; gap: 6px 4px; font-family: 'Geist Mono', monospace; font-size: 13px; }
    .recap-tag { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
    .recap-grid .v { min-width: 30px; padding: 3px 7px; border-radius: 6px; text-align: center; }
    .recap-note { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
      font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); }
    .recap-list.off .recap-res { color: var(--ink-4) !important; font-weight: 400 !important; }
    .offday { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 4px;
      font-size: 12px; color: var(--ink-3); }
    .offday button { background: none; border: none; padding: 4px 2px; font: inherit; color: var(--ink-3);
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .offday.suggest button, .backup-nudge button, .update-nudge button { color: var(--ink); }
    .update-notes { font-size: 13px; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap;
      max-height: 40vh; overflow-y: auto; margin: 4px 0 14px; }
    .setting-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
    .setting-sub.due { color: var(--accent); }
    .exs-dot.off { fill: var(--surface); stroke: var(--chart-line); stroke-width: 1.75; }
    .exs-recent.off .exs-res { color: var(--ink-4); font-style: italic; }
    .recap-grid .v.last { color: var(--ink-2); opacity: 0.7; }
    .recap-grid .v.up, .recap-grid .v.new { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .recap-grid .v.down { color: var(--ink-3); }
    .recap-grid .v.drop { color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); }
    .recap-grid .v.pr { color: var(--gold); background: color-mix(in srgb, var(--gold) 18%, transparent); font-weight: 600; }

    /* ===== UTIL ===== */
    .empty-state { text-align: center; padding: 48px 16px; color: var(--ink-3); font-size: 13px; }
    .hidden { display: none !important; }
    input[type=number], input[type=text] {
      font-family: inherit; color: var(--ink); background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      outline: none; font-size: 14px;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    textarea {
      font-family: inherit; color: var(--ink); background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      outline: none; font-size: 14px; line-height: 1.5; resize: vertical;
    }

    /* ===== PLATES ===== */
    .plate-breakdown {
      font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3);
      padding: 6px 10px; background: var(--surface-2); border-radius: 8px;
      margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .plate-tag { padding: 2px 6px; background: var(--surface-3); border-radius: 4px; color: var(--ink-2); }

  </style>
</head>
<body>
  <!-- Confetti (opt-in) -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Custom Dialog -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog-box">
      <div class="dialog-msg" id="dialog-msg"></div>
      <div class="dialog-buttons" id="dialog-buttons"></div>
    </div>
  </div>

  <div class="app-root">
    <div class="app-body" id="app-body">

      <!-- ONBOARDING -->
      <div id="screen-onboarding" class="screen-wrap">
        <div class="screen" id="ob-screen"></div>
      </div>

      <!-- HOME / TODAY -->
      <div id="screen-home" class="screen-wrap">
        <div class="screen" id="home-screen"></div>
      </div>

      <!-- HISTORY -->
      <div id="screen-history" class="screen-wrap">
        <div class="screen" id="history-screen"></div>
      </div>

      <!-- ACTIVE WORKOUT / TRAIN -->
      <div id="screen-workout" class="screen-wrap">
        <div class="workout-sticky" id="workout-sticky"></div>
        <div class="screen" id="workout-body" style="padding-top:18px"></div>
      </div>

      <!-- PROGRESS -->
      <div id="screen-progress" class="screen-wrap">
        <div class="screen" id="progress-screen"></div>
      </div>

      <!-- MENU (More tab) -->
      <div id="screen-menu" class="screen-wrap">
        <div class="screen" id="menu-screen"></div>
      </div>

      <!-- ROUTINES -->
      <div id="screen-routines" class="screen-wrap">
        <div class="screen" id="routines-screen"></div>
      </div>

      <!-- BUILDER -->
      <div id="screen-builder" class="screen-wrap">
        <div class="screen" id="builder-screen"></div>
      </div>

      <!-- PROGRAMS -->
      <div id="screen-programs" class="screen-wrap">
        <div class="screen" id="programs-screen"></div>
      </div>

      <!-- PROGRAM EDITOR -->
      <div id="screen-program-edit" class="screen-wrap">
        <div class="screen" id="program-edit-screen"></div>
      </div>

      <!-- EXERCISE BESTIARY -->
      <div id="screen-exercises" class="screen-wrap">
        <div class="screen" id="exercises-screen"></div>
      </div>

      <!-- SETTINGS -->
      <div id="screen-settings" class="screen-wrap">
        <div class="screen" id="settings-screen"></div>
      </div>

      <!-- FINISH -->
      <div id="screen-finish" class="screen-wrap">
        <div class="screen" id="finish-screen"></div>
      </div>

    </div>

    <!-- TAB BAR -->
    <div class="app-tabs" id="app-tabs">
      <button class="app-tab" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Today</span>
      </button>
      <button class="app-tab" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3L3 8"/><path d="M3 3v5h5"/><path d="M12 8v5l3 2"/></svg>
        <span>History</span>
      </button>
      <button class="app-tab" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M14 6h7v7"/></svg>
        <span>Progress</span>
      </button>
      <button class="app-tab" data-tab="programs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 18l9 5 9-5"/></svg>
        <span>Programs</span>
      </button>
      <button class="app-tab" data-tab="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        <span>More</span>
      </button>
    </div>
  </div>

  <!-- SHEETS (outside app-root so they can cover the full viewport) -->
  <div class="sheet-overlay" id="swap-overlay">
    <div class="sheet" id="swap-sheet"></div>
  </div>
  <div class="sheet-overlay" id="notes-overlay">
    <div class="sheet" id="notes-sheet"></div>
  </div>

    /* ========== THEME ========== */

    /* ========== UTILITIES ========== */

    }
    function formatDate(dateStr) {

    }

    /* ========== EXERCISE LIBRARY ========== */

    const LIBRARY_MAP = {};
    EXERCISE_LIBRARY.forEach(ex => LIBRARY_MAP[ex.id] = ex);

    const BB_DB_PAIRS = {};
    (function buildPairs() {
      const byBase = {};
      EXERCISE_LIBRARY.forEach(ex => {
        if (ex.equipment !== 'barbell' && ex.equipment !== 'dumbbell') return;
        const m = ex.id.match(/^(.+)-(bb|db)$/);
        if (m) {
          const base = m[1];
          if (!byBase[base]) byBase[base] = {};
          byBase[base][ex.equipment] = ex.id;
        }
      });
      byBase['row'] = { barbell: 'barbell-row', dumbbell: 'dumbbell-row' };
      Object.values(byBase).forEach(pair => {
        if (pair.barbell && pair.dumbbell) {
          BB_DB_PAIRS[pair.barbell] = pair.dumbbell;
          BB_DB_PAIRS[pair.dumbbell] = pair.barbell;
        }
      });
    })();

    const PLATES_KG = [20, 10, 5, 2.5, 1.25];
    const PLATES_LBS = [45, 25, 10, 5, 2.5];
    function calculatePlates(totalWeight, barWeight, unit) {
      const plates = unit === 'lbs' ? PLATES_LBS : PLATES_KG;
      let perSide = (totalWeight - barWeight) / 2;
      if (perSide <= 0) return { plates: [], leftover: 0 };
      const result = [];
      for (const plate of plates) {
        while (perSide >= plate - 0.001) { result.push(plate); perSide -= plate; }
      }
      return { plates: result, leftover: Math.abs(perSide) < 0.01 ? 0 : perSide };
    }
    function getPlateBreakdownHTML(weight, unit) {
      if (!weight || weight === '') return '';
      const w = Number(weight);
      const barWeight = appData.settings.barWeight || (unit === 'lbs' ? 45 : 20);
      if (w <= 0) return '';
      if (w < barWeight) return `<div class="plate-breakdown">Under bar weight</div>`;
      if (w === barWeight) return `<div class="plate-breakdown">Bar only</div>`;
      const { plates, leftover } = calculatePlates(w, barWeight, unit);
      if (leftover > 0) return `<div class="plate-breakdown">Can't plate exactly</div>`;
      if (plates.length === 0) return `<div class="plate-breakdown">Bar only</div>`;
      const grouped = [];
      plates.forEach(p => {
        const last = grouped[grouped.length - 1];
        if (last && last.v === p) last.c++;
        else grouped.push({ v: p, c: 1 });
      });
      const tags = grouped.map(g => `<span class="plate-tag">${g.c > 1 ? g.c + '&times;' : ''}${g.v}</span>`).join('');
      return `<div class="plate-breakdown">Per side · ${tags}</div>`;
    }

    const LEGACY_NAME_MAP = {
      'Squat': 'squat-bb', 'Bench Press': 'bench-press-bb', 'Overhead Press': 'ohp-bb',
      'Incline Bench Press': 'incline-bench-bb', 'Deadlift': 'deadlift', 'Barbell Row': 'barbell-row',
      'Lat Pulldown': 'lat-pulldown', 'Pullups / Lat Pulldown': 'lat-pulldown',
      'Machine Row': 'machine-row', 'Biceps Curl': 'bicep-curl-db', 'Leg Press': 'leg-press',
    };

    // Only used to wrap routines from before programs existed; new installs start with no program.
    const DEFAULT_PROGRAM_ID = 'default-fullbody';

    /* ========== PROGRAMS ========== */
    function getActiveProgram() {
      if (!appData.programs || appData.programs.length === 0) return null;
      const id = appData.settings.activeProgramId;
      return appData.programs.find(p => p.id === id) || appData.programs[0];
    }
    function getActiveRoutines() {
      const p = getActiveProgram();
      if (!p) return [];
      return p.routineIds.map(rid => appData.routines.find(r => r.id === rid)).filter(Boolean);
    }
    function findLastSessionInProgram(program) {
      if (!program) return null;
      const set = new Set(program.routineIds);
      for (let i = appData.sessions.length - 1; i >= 0; i--) {
        if (set.has(appData.sessions[i].routineId)) return appData.sessions[i];
      }
      return null;
    }

    // An exercise's step is its next weight increment: what double progression adds once you've earned it,
    // and the ± on the weight buttons. Set per exercise in the Bestiary.
    function getWeightStep(equipment, exerciseId) {
      if (exerciseId && appData && appData.exerciseOverrides && appData.exerciseOverrides[exerciseId] && appData.exerciseOverrides[exerciseId].step !== undefined) {
        return Math.max(0.5, appData.exerciseOverrides[exerciseId].step);
      }
      return equipment === 'barbell' ? 2.5 : 1;
    }
    // Rep target: "10-15" is a range, "10" a range of one. Returns { lo, hi } or null.
    function parseRepRange(v) {
      const m = String(v ?? '').match(/(\d+)\s*(?:[-–—]|to)\s*(\d+)/);
      if (m) { const a = +m[1], b = +m[2]; return { lo: Math.min(a, b), hi: Math.max(a, b) }; }
      const n = parseInt(v);
      return n > 0 ? { lo: n, hi: n } : null;
    }
    // Rep target for an exercise newly added to a routine: a range sized to the usual weight jump
    // (big relative jumps need wider ranges).
    function defaultRepTarget(libEx) {
      if (parseRepRange(libEx.defaultReps)?.hi > parseRepRange(libEx.defaultReps)?.lo) return String(libEx.defaultReps);
      if (libEx.equipment === 'bodyweight') return String(libEx.defaultReps);
      return { barbell: '5-8', machine: '10-15' }[libEx.equipment] || '8-12';
    }
    // After a weight jump: if the last 2 normal sessions at this weight both fell below the bottom of
    // the range (best set < lo), suggest stepping back. Off days don't count. Returns advice or ''.
    function belowRangeAdvice(name, weight, range, po) {
      if (!range || !weight || !(po > 0)) return '';
      let streak = 0;
      for (let i = appData.sessions.length - 1; i >= 0 && streak < 2; i--) {
        const sess = appData.sessions[i];
        if (sess.offDay) continue;
        const e = sess.exercises.find(x => x.name === name);
        const sets = e ? e.sets.filter(s => s.completed && !s.drop) : [];
        if (!sets.length) continue;
        if (Math.max(...sets.map(s => Number(s.weight) || 0)) !== Number(weight)) break;
        if (Math.max(...sets.map(s => Number(s.reps) || 0)) >= range.lo) break;
        streak++;
      }
      return streak >= 2 ? `Below range twice at ${weight} ${appData.settings.unit}. Consider ${+(weight - po).toFixed(2)} for another round.` : '';
    }

    /* ========== DATA LAYER ========== */
    function loadData() {
      const raw = localStorage.getItem('workoutData');
      if (raw) return JSON.parse(raw);
      return { sessions: [], settings: { defaultRestTime: 90, unit: 'kg', hapticsEnabled: true }, personalRecords: {} };
    }
    function saveData(data) {
      localStorage.setItem('workoutData', JSON.stringify(data));
      scheduleMirror();
      queueNativeSync();
    }
    // migrateData() saves defaults on a fresh install, so remember whether there was real data first.
    const HAD_DATA = !!localStorage.getItem('workoutData');
    let appData = loadData();

    // Native safety net: a copy of workoutData in the app's files dir, which Android Auto Backup
    // saves to Google. Held off until boot has checked for a restore, so a fresh install's
    // defaults never overwrite the copy it might restore from.
    const MIRROR_FILE = 'workoutData.json';
    let mirrorReady = false, mirrorTimer = null;
    function scheduleMirror() {
      if (!IS_NATIVE || !mirrorReady) return;
      clearTimeout(mirrorTimer);
      mirrorTimer = setTimeout(writeMirror, 2000);
    }
    function writeMirror() {
      clearTimeout(mirrorTimer); mirrorTimer = null;
      const raw = localStorage.getItem('workoutData');
      if (!IS_NATIVE || !mirrorReady || !raw) return;
      NP.Filesystem.writeFile({ path: MIRROR_FILE, data: raw, directory: 'DATA', encoding: 'utf8' }).catch(() => {});
    }

    function migrateData() {
      if (!appData.personalRecords) appData.personalRecords = {};
      if (appData.settings.hapticsEnabled === undefined) appData.settings.hapticsEnabled = true;
      if (appData.settings.confettiOnPR === undefined) appData.settings.confettiOnPR = false;
      // New installs start empty: you build your own routines and program.
      if (!appData.routines) appData.routines = [];
      appData.sessions.forEach(s => {
        if (s.notes === undefined) s.notes = '';
        if (!s.routineId && s.type) {
          s.routineId = s.type === 'A' ? 'default-a' : 'default-b';
          s.routineName = s.type === 'A' ? 'Workout A' : 'Workout B';
        }
        s.exercises.forEach(ex => {
          const legacyId = LEGACY_NAME_MAP[ex.name];
          if (legacyId) {
            const libEx = LIBRARY_MAP[legacyId];
            if (libEx) { ex.name = libEx.name; if (!ex.equipment) ex.equipment = libEx.equipment; }
          }
          if (!ex.equipment) ex.equipment = 'barbell';
          if (!ex.targetReps && ex.exerciseId) {
            const lib = LIBRARY_MAP[ex.exerciseId];
            if (lib) ex.targetReps = lib.defaultReps;
          }
        });
      });
      if (appData.settings.barWeight === undefined) {
        appData.settings.barWeight = appData.settings.unit === 'lbs' ? 45 : 20;
      }
      if (!appData.exerciseNotes) appData.exerciseNotes = {};
      if (!appData.restOverrides) appData.restOverrides = {}; // learned rest per exercise, from ±30 taps
      if (!appData.settings.chartOrder) appData.settings.chartOrder = [];
      if (!appData.customExercises) appData.customExercises = [];
      if (!appData.exerciseOverrides) appData.exerciseOverrides = {};
      // Older saves kept a separate overload ("po") and default sets/reps per exercise. Step is the one
      // increment now, and routines own sets/reps.
      Object.entries(appData.exerciseOverrides).forEach(([id, ov]) => {
        if (!ov || typeof ov !== 'object') { delete appData.exerciseOverrides[id]; return; }
        if (ov.step === undefined && ov.po > 0) ov.step = ov.po;
        delete ov.po; delete ov.defaultSets; delete ov.defaultReps;
        if (ov.step === undefined) delete appData.exerciseOverrides[id];
      });
      appData.customExercises.forEach(ex => {
        if (!LIBRARY_MAP[ex.id]) { EXERCISE_LIBRARY.push(ex); LIBRARY_MAP[ex.id] = ex; }
      });
      if (!appData.creatineLog) appData.creatineLog = {};

      // Programs migration (once, for data from before programs existed): wrap existing routines in a
      // "Full Body" program. With no routines, or once programs exist, having none is fine.
      if (!appData.programs) {
        appData.programs = [];
        if (appData.routines.length) {
          appData.programs.push({ id: DEFAULT_PROGRAM_ID, name: 'Full Body', routineIds: appData.routines.map(r => r.id) });
          appData.settings.activeProgramId = DEFAULT_PROGRAM_ID;
        }
      }
      // Keep program routineIds in sync with existing routines (drop refs to deleted routines)
      const liveIds = new Set(appData.routines.map(r => r.id));
      appData.programs.forEach(p => {
        p.routineIds = (p.routineIds || []).filter(id => liveIds.has(id));
      });
      // Point at a program that exists (or none)
      if (!appData.programs.find(p => p.id === appData.settings.activeProgramId)) {
        appData.settings.activeProgramId = appData.programs.length ? appData.programs[0].id : null;
      }

      rebuildAllPRs();
      saveData(appData);
    }

    /* ========== PERSONAL RECORDS ========== */
    function computePR(exerciseName) {
      let maxWeight = 0, prDate = '', prReps = 0;
      appData.sessions.forEach(s => {
        s.exercises.forEach(ex => {
          if (ex.name === exerciseName) {
            ex.sets.forEach(set => {
              if (!set.completed || set.drop || set.weight === '' || set.weight === null) return;
              const w = Number(set.weight), r = Number(set.reps) || 0;
              // Heavier beats everything; same weight only counts with more reps.
              if (w > maxWeight || (w === maxWeight && w > 0 && r > prReps)) {
                maxWeight = w; prReps = r; prDate = s.date;
              }
            });
          }
        });
      });
      return maxWeight > 0 ? { maxWeight, date: prDate, reps: prReps } : null;
    }
    function rebuildAllPRs() {
      const all = new Set();
      appData.sessions.forEach(s => s.exercises.forEach(ex => all.add(ex.name)));
      appData.personalRecords = {};
      all.forEach(name => { const pr = computePR(name); if (pr) appData.personalRecords[name] = pr; });
    }
    function computeEstimated1RM(exerciseName) {
      let best = 0;
      appData.sessions.forEach(s => s.exercises.forEach(ex => {
        if (ex.name === exerciseName) ex.sets.forEach(set => {
          if (set.completed && set.weight && set.reps) {
            const w = Number(set.weight), r = Number(set.reps);
            if (w > 0 && r > 0) { const e = w * (1 + r / 30); if (e > best) best = e; }
          }
        });
      }));
      return best > 0 ? Math.round(best) : null;
    }
    // A set beats the record if it is heavier, or the same weight for more reps.
    function beatsPR(pr, weight, reps) {
      if (!pr) return false;
      const w = Number(weight), r = Number(reps) || 0;
      if (!w) return false;
      if (w > pr.maxWeight) return true;
      return w === pr.maxWeight && r > (Number(pr.reps) || 0);
    }
    function checkForNewPR(exerciseName, weight, reps) {
      if (weight === '' || weight === null || weight === 0) return false;
      const numWeight = Number(weight);
      const numReps = Number(reps) || 0;
      const current = appData.personalRecords[exerciseName];
      if (!current) return false;
      if (!beatsPR(current, numWeight, numReps)) return false;
      appData.personalRecords[exerciseName] = { maxWeight: numWeight, date: todayISO(), reps: numReps };
      return true;
    }

    /* ========== HAPTICS + WAKE LOCK + NOTIFY ========== */
    function triggerHaptic(type) {
      if (!appData.settings.hapticsEnabled) return;
      const patterns = {
        setComplete: [30], pr: [50, 30, 50, 30, 100], restTimerDone: [200, 100, 200, 100, 200],
        workoutFinished: [100, 50, 100, 50, 200], dragStart: [20], weightAdjust: [10], light: [15], success: [30, 30, 60],
      };
      const pattern = patterns[type] || [20];
      if (IS_NATIVE) {
        // Same on/off pattern as navigator.vibrate: even entries buzz, odd entries are gaps.
        let t = 0;
        pattern.forEach((ms, i) => {
          if (i % 2 === 0) setTimeout(() => NP.Haptics.vibrate({ duration: ms }).catch(() => {}), t);
          t += ms;
        });
        return;
      }
      if (navigator.vibrate) navigator.vibrate(pattern);
    }
    let wakeLock = null;
    async function acquireWakeLock() {
      if (IS_NATIVE) { NP.KeepAwake.keepAwake().catch(() => {}); return; }
      if (!('wakeLock' in navigator)) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
    }
    function releaseWakeLock() {
      if (IS_NATIVE) { NP.KeepAwake.allowSleep().catch(() => {}); return; }
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && currentSession) acquireWakeLock();
    });

    // Native rest alarm: a notification scheduled for when the rest ends, so it fires even with the
    // phone locked or the app killed. Rescheduled on ±30, cancelled whenever the rest is cleared.
    const REST_NOTIF_ID = 1;
    let exactAlarms = false, alarmChain = Promise.resolve();
    async function setupRestNotifications() {
      const LN = NP.LocalNotifications;
      await LN.createChannel({ id: 'rest', name: 'Rest timer', description: 'Tells you when a rest is over',
                               importance: 5, visibility: 1, vibration: true });
      // Exact alarms are granted via USE_EXACT_ALARM; if not, schedule inexact rather than have the
      // plugin open the system settings screen in the middle of a workout.
      const s = await LN.checkExactNotificationSetting();
      exactAlarms = s.exact_alarm === 'granted';
    }
    function scheduleRestAlarm() {
      if (!IS_NATIVE || !restStartedAt || !restDuration) return;
      queueNativeSync();
      const at = new Date(restStartedAt + restDuration * 1000);
      const body = restExName && restExName !== 'REST' ? `Next set · ${restExName}` : 'Time for your next set.';
      const LN = NP.LocalNotifications;
      alarmChain = alarmChain
        .then(() => LN.cancel({ notifications: [{ id: REST_NOTIF_ID }] }))
        .then(() => LN.schedule({ notifications: [{
          id: REST_NOTIF_ID, title: 'Rest over', body, channelId: 'rest', smallIcon: 'ic_stat_workout',
          iconColor: '#E97A52', foreground: true, isExactNotification: exactAlarms,
          schedule: { at, allowWhileIdle: true },
        }] }))
        .catch(() => {});
    }
    function cancelRestAlarm() {
      if (!IS_NATIVE) return;
      alarmChain = alarmChain
        .then(() => NP.LocalNotifications.cancel({ notifications: [{ id: REST_NOTIF_ID }] }))
        .catch(() => {});
    }

    /* ========== NATIVE: LIVE NOTIFICATION, SHORTCUTS, WIDGET ========== */
    // After a change to the workout or the data, push one snapshot to Android: the ongoing workout
    // notification (elapsed time, or rest countdown with +30/Skip), the long-press shortcuts on the
    // app icon, and the home-screen widget. Coalesced, since a set tick triggers several saves.
    const APP_URL = 'dev.nbilic.workout://';
    let nativeSyncTimer = null;
    function queueNativeSync() {
      if (!IS_NATIVE) return;
      clearTimeout(nativeSyncTimer);
      nativeSyncTimer = setTimeout(syncNative, 250);
    }
    function syncNative() {
      const W = NP.WorkoutNative;
      if (!W) return;
      // A workout is live exactly while its recovery backup exists (cleared on finish/discard).
      const live = !!currentSession && !!localStorage.getItem('workoutBackup');
      const restEndsAt = live && isResting && restStartedAt ? restStartedAt + restDuration * 1000 : 0;
      W.session({ active: live, title: live ? (currentSession.routineName || 'Workout') : '',
                  startedAt: live ? (currentSession.startedAt || Date.now()) : 0, restEndsAt }).catch(() => {});

      const program = getActiveProgram();
      const next = program && !live ? appData.routines.find(r => r.id === getNextRoutineId()) : null;
      const startUrl = r => APP_URL + 'start/' + encodeURIComponent(r.id);

      const items = [];
      if (live) items.push({ id: 'continue', label: `Continue ${currentSession.routineName || 'workout'}`, url: APP_URL + 'continue', icon: 'continue' });
      else if (next) {
        items.push({ id: 'start-next', label: `Start ${next.name}`, url: startUrl(next), icon: 'start' });
        getActiveRoutines().filter(r => r.id !== next.id).slice(0, 2)
          .forEach(r => items.push({ id: 'start-' + r.id, label: `Start ${r.name}`, url: startUrl(r), icon: 'start' }));
      } else items.push({ id: 'new-program', label: 'Create a program', url: APP_URL + 'new-program', icon: 'add' });
      W.shortcuts({ items }).catch(() => {});

      let w;
      if (live) {
        const sets = currentSession.exercises.flatMap(e => e.sets);
        w = { eyebrow: 'IN PROGRESS', title: currentSession.routineName || 'Workout',
              meta: `${sets.filter(x => x.completed).length} of ${sets.length} sets done`, actionLabel: 'Continue', actionUrl: APP_URL + 'continue' };
      } else if (next) {
        w = { eyebrow: 'NEXT UP', title: next.name, meta: `${next.exercises.length} exercise${next.exercises.length === 1 ? '' : 's'} · ${program.name}`, actionLabel: 'Begin', actionUrl: startUrl(next) };
      } else {
        w = { eyebrow: 'GET SET UP', title: 'No program yet', meta: 'Create one to get started', actionLabel: 'Create', actionUrl: APP_URL + 'new-program' };
      }
      const since = new Date(Date.now() - 9 * 86400000).toISOString().slice(0, 10);
      w.dates = [...new Set(appData.sessions.map(x => x.date).filter(d => d && d >= since))];
      W.widget(w).catch(() => {});
    }
    // Shortcut / widget links: dev.nbilic.workout://start/<routineId> | continue | new-program
    function handleAppUrl(url) {
      const m = String(url || '').match(/^dev\.nbilic\.workout:\/\/([a-z-]+)\/?(.*)$/);
      if (!m || !localStorage.getItem('w-onboarded')) return;
      const [, action, arg] = m;
      closeAnyOpenSheet();
      if (action === 'continue' || (action === 'start' && currentSession)) {
        showScreen(currentSession ? 'workout' : 'home'); // never discard a live workout from a shortcut
      } else if (action === 'start') {
        const id = decodeURIComponent(arg);
        if (appData.routines.some(r => r.id === id)) startWorkoutById(id); else showScreen('home');
      } else if (action === 'new-program') {
        openProgramEdit(null, 'home');
      }
    }

    async function requestNotificationPermission() {
      if (IS_NATIVE) {
        try {
          const LN = NP.LocalNotifications;
          const p = await LN.checkPermissions();
          if (p.display !== 'granted' && p.display !== 'denied') await LN.requestPermissions();
        } catch (e) {}
        return;
      }
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    }
    // Only matters when you've switched away. Must go through the service worker:
    // Android Chrome rejects `new Notification()` from a page. (Native uses the scheduled alarm.)
    function sendRestNotification() {
      if (IS_NATIVE) return;
      if (!('Notification' in window) || Notification.permission !== 'granted' || document.visibilityState !== 'hidden') return;
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.ready.then(reg => reg.showNotification('Rest over', {
        body: 'Time for your next set.', icon: 'icon-192.png', tag: 'rest-done', renotify: true, vibrate: [200, 100, 200],
      })).catch(() => {});
    }

    // Mobile browsers only let audio play from a context unlocked by a tap. Ticking a set is a tap,
    // so we unlock there and reuse the context for the rest-over beep.
    let audioCtx = null;
    function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    /* ========== CONFETTI (opt-in) ========== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [], confettiAnimId = null;
    function resizeConfetti() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();
    function launchConfetti() {
      if (!appData.settings.confettiOnPR) return;
      confettiParticles = [];
      const colors = [ getCSS('--accent'), getCSS('--accent-2'), getCSS('--good'), getCSS('--gold') ];
      for (let i = 0; i < 80; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width, y: -10 - Math.random() * 40,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
          vx: (Math.random() - 0.5) * 6, vy: 2 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10, life: 1
        });
      }
      if (!confettiAnimId) animateConfetti();
    }
    function getCSS(varName) { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#e97a52'; }
    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;
      confettiParticles.forEach(p => {
        if (p.life <= 0) return;
        alive = true;
        p.x += p.vx; p.vy += 0.1; p.y += p.vy;
        p.rotation += p.rotSpeed; p.life -= 0.005;
        if (p.y > confettiCanvas.height + 20) { p.life = 0; return; }
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y); confettiCtx.rotate(p.rotation * Math.PI / 180);
        confettiCtx.globalAlpha = Math.max(0, p.life); confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      });
      if (alive) confettiAnimId = requestAnimationFrame(animateConfetti);
      else { confettiAnimId = null; confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }
    }

    /* ========== CUSTOM DIALOG ========== */
    function customDialog(msg, showCancel) {
      return new Promise(resolve => {
        const overlay = document.getElementById('dialog-overlay');
        document.getElementById('dialog-msg').textContent = msg;
        const btns = document.getElementById('dialog-buttons');
        let html = '';
        if (showCancel) html += '<button class="dialog-btn dialog-btn-cancel" id="dialog-cancel">Cancel</button>';
        html += '<button class="dialog-btn dialog-btn-confirm" id="dialog-ok">OK</button>';
        btns.innerHTML = html;
        requestAnimationFrame(() => overlay.classList.add('active'));
        function close(val) { overlay.classList.remove('active'); resolve(val); }
        document.getElementById('dialog-ok').onclick = () => close(true);
        if (showCancel) document.getElementById('dialog-cancel').onclick = () => close(false);
        overlay.onclick = (e) => { if (e.target === overlay) close(false); };
      });
    }
    const customConfirm = (m) => customDialog(m, true);
    const customAlert = (m) => customDialog(m, false);

    /* ========== SCREEN ROUTER ========== */
    let activeScreen = 'home';
    let navigatingViaPopstate = false;
    const HIDE_TABS_ON = new Set(['workout', 'builder', 'finish', 'onboarding', 'program-edit']);

    function showScreen(id) {
      const prevScreen = activeScreen;
      document.querySelectorAll('.screen-wrap').forEach(s => s.classList.remove('active'));
      const target = document.getElementById('screen-' + id);
      if (!target) return;
      target.classList.add('active');
      activeScreen = id;

      // Tab bar visibility + active tab
      const tabBar = document.getElementById('app-tabs');
      if (HIDE_TABS_ON.has(id)) tabBar.classList.add('hidden');
      else tabBar.classList.remove('hidden');
      const tabMap = { home: 'home', history: 'history', workout: 'workout', progress: 'progress', menu: 'menu',
                       routines: 'menu', builder: 'menu', settings: 'menu', exercises: 'menu',
                       programs: 'programs', 'program-edit': 'programs' };
      const tabId = tabMap[id];
      document.querySelectorAll('.app-tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tabId));

      // Render on nav
      if (id === 'home') renderHome();
      else if (id === 'history') renderHistory();
      else if (id === 'progress') renderProgress();
      else if (id === 'menu') renderMenu();
      else if (id === 'routines') renderRoutines();
      else if (id === 'settings') renderSettings();
      else if (id === 'exercises') renderBestiary();
      else if (id === 'workout') renderWorkout();
      else if (id === 'builder') renderBuilder();
      else if (id === 'finish') renderFinish();
      else if (id === 'onboarding') renderOnboarding();
      else if (id === 'programs') renderPrograms();
      else if (id === 'program-edit') renderProgramEdit();

      if (id === 'workout' && currentSession) acquireWakeLock();
      if (id !== 'workout') releaseWakeLock();
      window.scrollTo(0, 0);

      if (!navigatingViaPopstate) {
        const cs = history.state;
        if (!cs || cs.screen !== id) history.pushState({ screen: id, prev: prevScreen }, '', '');
      }
    }
    history.replaceState({ screen: 'home' }, '', '');

    // Leave an editor (routine builder, program editor) for the screen it came from. Going back in
    // history, rather than pushing, keeps the finished editor off the back stack, so Back can't
    // reopen it with stale state and save a duplicate.
    function leaveScreen(to) {
      const st = history.state;
      if (st && st.screen === activeScreen && st.prev === to) { history.back(); return; }
      history.replaceState({ screen: to }, '', '');
      navigatingViaPopstate = true;
      showScreen(to);
      navigatingViaPopstate = false;
    }

    function closeAnyOpenSheet() {
      const sheets = document.querySelectorAll('.sheet-overlay.active');
      if (sheets.length === 0) return false;
      sheets.forEach(el => el.classList.remove('active'));
      document.body.style.overflow = '';
      return true;
    }
    function closeAnyOpenDialog() {
      const d = document.querySelector('.dialog-overlay.active');
      if (!d) return false;
      d.classList.remove('active');
      return true;
    }
    window.addEventListener('popstate', async function(e) {
      if (closeAnyOpenSheet() || closeAnyOpenDialog()) {
        history.pushState({ screen: activeScreen }, '', '');
        return;
      }
      const target = (e.state && e.state.screen) || 'home';
      navigatingViaPopstate = true;
      showScreen(target);
      navigatingViaPopstate = false;
    });

    // Tab bar clicks
    document.querySelectorAll('.app-tab').forEach(btn => {
      btn.addEventListener('click', () => showScreen(btn.dataset.tab));
    });

    /* ========== VOLUME ========== */
    function calcSessionVolume(session) {
      return session.exercises.reduce((total, ex) =>
        total + ex.sets.reduce((sum, s) => {
          if (s.completed && s.weight && s.reps) return sum + Number(s.weight) * Number(s.reps);
          return sum;
        }, 0), 0);
    }

    /* ========== SESSION STATE ========== */
    let currentSession = null;
    let elapsedInterval = null;
    function getElapsedSeconds() {
      if (!currentSession || !currentSession.startedAt) return 0;
      return Math.floor((Date.now() - currentSession.startedAt) / 1000);
    }
    // Last time you did this exercise. Off days are skipped (they'd drag prefill and bumps down),
    // unless there's nothing else to go on.
    function findLastSessionWithExercise(name) {
      for (const skipOff of [true, false]) {
        for (let i = appData.sessions.length - 1; i >= 0; i--) {
          if (skipOff && appData.sessions[i].offDay) continue;
          const ex = appData.sessions[i].exercises.find(e => e.name === name);
          if (ex) return ex;
        }
      }
      return null;
    }
    function getLastUsedWeight(name) {
      for (let i = appData.sessions.length - 1; i >= 0; i--) {
        const ex = appData.sessions[i].exercises.find(e => e.name === name);
        if (ex) { const set = ex.sets.find(s => s.weight !== '' && s.weight !== null && s.completed);
          if (set) return Number(set.weight); }
      }
      return null;
    }
    function saveSessionBackup() {
      if (currentSession) localStorage.setItem('workoutBackup', JSON.stringify({ session: currentSession, timestamp: Date.now() }));
      queueNativeSync();
    }
    function clearSessionBackup() { localStorage.removeItem('workoutBackup'); queueNativeSync(); }

    /* ========== WEEKLY STREAK ========== */
    function calculateWeeklyStreak() {
      if (appData.sessions.length === 0) return 0;
      const now = new Date();
      const dayOfWeek = (now.getDay() + 6) % 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - dayOfWeek); monday.setHours(0,0,0,0);
      const sessionDates = new Set(appData.sessions.map(s => s.date));
      let streak = 0, weekStart = new Date(monday);
      while (true) {
        const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
        let found = false;
        for (let d = new Date(weekStart); d <= weekEnd; d.setDate(d.getDate() + 1)) {
          if (sessionDates.has(d.toISOString().slice(0,10))) { found = true; break; }
        }
        if (found) { streak++; weekStart.setDate(weekStart.getDate() - 7); }
        else break;
      }
      return streak;
    }

    /* ========== RUN MIGRATIONS + INIT ========== */
    migrateData();

    /* ========== HOME / TODAY ========== */
    let calYear, calMonth;
    (function initCal(){ const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); })();

    function getNextRoutineId() {
      const program = getActiveProgram();
      const ids = program ? program.routineIds : [];
      if (ids.length === 0) {
        return appData.routines.length > 0 ? appData.routines[0].id : null;
      }
      // Explicit override (e.g. after switching programs)
      if (appData.settings.pendingNextRoutineId && ids.includes(appData.settings.pendingNextRoutineId)) {
        return appData.settings.pendingNextRoutineId;
      }
      if (ids.length === 1) return ids[0];
      const lastInProgram = findLastSessionInProgram(program);
      if (!lastInProgram) return ids[0];
      const lastIdx = ids.indexOf(lastInProgram.routineId);
      return ids[(lastIdx + 1) % ids.length];
    }

    function calNav(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderHomeCalendar();
    }

    function renderHomeCalendar() {
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const el = document.getElementById('home-cal');
      if (!el) return;
      const prefix = calYear + '-' + String(calMonth + 1).padStart(2, '0');
      const dayMap = {};
      appData.sessions.forEach(s => {
        if (s.date.startsWith(prefix)) {
          const day = parseInt(s.date.split('-')[2]);
          if (!dayMap[day]) dayMap[day] = new Set();
          dayMap[day].add(s.routineId || (s.type === 'A' ? 'default-a' : 'default-b'));
        }
      });
      const now = new Date();
      const isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth();
      const todayDate = now.getDate();
      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const startOffset = (firstDay + 6) % 7;

      let head = '<div class="row-between" style="margin-bottom:14px"><span class="eyebrow">' + MONTHS[calMonth] + ' ' + calYear + '</span>' +
        '<div class="h-stack" style="gap:4px">' +
        '<button class="icon-btn" style="width:28px;height:28px" onclick="calNav(-1)">' + svg('chevLeft', 14) + '</button>' +
        '<button class="icon-btn" style="width:28px;height:28px" onclick="calNav(1)">' + svg('chevRight', 14) + '</button>' +
        '</div></div>';
      let dows = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px">';
      ['M','T','W','T','F','S','S'].forEach(d => { dows += `<div class="cal-dow">${d}</div>`; });
      dows += '</div>';
      let grid = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
      for (let i = 0; i < startOffset; i++) grid += '<div></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = prefix + '-' + String(day).padStart(2, '0');
        const isToday = isCurrentMonth && day === todayDate;
        const isFuture = calYear > now.getFullYear() || (calYear === now.getFullYear() && calMonth > now.getMonth()) ||
                         (isCurrentMonth && day > todayDate);

        if (dayMap[day] && !isToday) {
          dotsHtml = '<div class="cal-dots">';

            const cls2 = (r && r.id === 'default-b') || (r && r.colorIndex === 1) ? 'badge-dot-b' : 'badge-dot-a';
            dotsHtml += `<span class="badge-dot ${cls2}"></span>`;
          });
          dotsHtml += '</div>';
        }
        grid += `<div class="${cls}"><span>${day}</span>${dotsHtml}</div>`;
      }
      grid += '</div>';
      el.innerHTML = head + dows + grid;
    }
