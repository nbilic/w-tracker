name: Android

on:
  push:
    branches: [native/app]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build web assets and sync Capacitor
        run: |
          npm ci
          node scripts/build-web.js
          npx cap sync android

      - name: Debug APK (branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug lintDebug -PappVersion=0.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: workout-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Signed release APK (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret is missing"; exit 1; fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PappVersion="$VERSION"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/workout-tracker-$GITHUB_REF_NAME.apk"
          rm -f "$ANDROID_KEYSTORE_PATH"

      # The annotated tag's message becomes the release notes, which the app shows before updating.
      - name: Release notes from tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ runner.temp }}/workout-tracker-${{ github.ref_name }}.apk
          body_path: ${{ runner.temp }}/notes.md
